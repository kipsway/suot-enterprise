<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПроОТ — охрана труда</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<script src="js/api.js"></script>
<script src="js/i18n.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/tabs.js"></script>
<script src="js/table.js"></script>
<script src="js/pages.js"></script>
<script src="js/palette.js"></script>
<script src="js/photos.js"></script>
<script src="js/import_wizard.js"></script>
<script src="js/export_dialog.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/print_editor.js"></script>
<script src="js/reports.js"></script>
<script src="js/reminders_bell.js"></script>
<script src="js/ai_chat.js"></script>
<script src="js/batch_print.js"></script>
<script src="js/settings_center.js"></script>
<script src="js/part18.js"></script>
<script src="js/part19.js"></script>
<script src="js/setup_wizard.js"></script>
<script defer src="vendor/alpine.min.js"></script>
</head>
<body x-data="suotApp()" x-init="init()" :data-theme="theme" x-cloak
      @suot-logout.window="logout()"
      @suot-toggle-theme.window="toggleTheme()"
      @suot-table-settings.window="openTableSettings($event.detail.key)"
      @suot-table-settings.window="openTableSettings($event.detail.key)"
      
<!-- ═══════════ ЭКРАН 1: ВЫБОР ЯЗЫКА ═══════════ -->
<template x-if="screen === 'lang'">
<div class="screen screen-lang">
  <div class="lang-wrap">
    <div class="brand-mark" x-html="icons.logo"></div>
    <h1 class="lang-title" x-text="t('app.name')"></h1>
    <p class="lang-sub">Select your language / Выберите язык</p>
    <div class="lang-cards">
      <button class="lang-card" @click="chooseLang('ru')">
        <span class="lang-flag">🇷🇺</span>
        <span class="lang-name">Русский</span>
        <span class="lang-hint">Продолжить на русском</span>
      </button>
      <button class="lang-card" @click="chooseLang('en')">
        <span class="lang-flag">🇬🇧</span>
        <span class="lang-name">English</span>
        <span class="lang-hint">Continue in English</span>
      </button>
    </div>
    <p class="lang-version" x-text="'v' + $store.version"></p>
  </div>
</div>
</template>

<!-- ═══════════ ЭКРАН 1.5: МАСТЕР ПЕРВОГО ЗАПУСКА ═══════════ -->
<template x-if="screen === 'setup'">
<div class="screen screen-setup" x-data="setupWizard()">
  <div class="setup-card card anim-in">
    <div class="auth-head">
      <div class="brand-mark sm" x-html="icons.logo"></div>
      <h1 x-text="ru('Добро пожаловать в ПроОТ','Welcome to ProOT')"></h1>
      <p class="muted"
         x-text="ru('Первоначальная настройка — три коротких шага','Initial setup — three short steps')"></p>
    </div>

    <div class="setup-steps">
      <span class="s-step" :class="{on: step>=1}">1</span>
      <span class="s-line" :class="{on: step>=2}"></span>
      <span class="s-step" :class="{on: step>=2}">2</span>
      <span class="s-line" :class="{on: step>=3}"></span>
      <span class="s-step" :class="{on: step>=3}">3</span>
    </div>

    <!-- Шаг 1: Организация -->
    <div x-show="step===1" class="setup-body">
      <label class="field"><span
            x-text="ru('Название организации','Organization name')"></span>
        <input type="text" class="field-input" x-model="f.org_name"
               :placeholder="ru('ООО «Ромашка»', 'Acme Inc.')"
               maxlength="80"></label>
      <label class="field"><span
            x-text="ru('Логотип (до 300 КБ, необязательно)','Logo (≤300 KB, optional)')"></span>
        <input type="file" accept="image/*" class="field-input"
               @change="pickLogo($event)"></label>
      <div class="logo-prev-wrap" x-show="logoData">
        <img :src="logoData" x-ref="logoPrev" class="logo-prev" alt="">
      </div>
      <p class="hint muted"
         x-text="ru('Можно пропустить и заполнить позже в настройках.','You can skip this and set it later.')"></p>
    </div>

    <!-- Шаг 2: Администратор -->
    <div x-show="step===2" class="setup-body">
      <label class="field"><span x-text="t('auth.username')"></span>
        <input type="text" class="field-input" x-model="f.username"
               autocomplete="username" required></label>
      <label class="field"><span
            x-text="ru('Ваше имя','Your full name')"></span>
        <input type="text" class="field-input" x-model="f.full_name"
               autocomplete="name"></label>
      <label class="field"><span x-text="t('auth.password')"></span>
        <input type="password" class="field-input" x-model="f.password"
               autocomplete="new-password" required></label>
      <label class="field"><span
            x-text="ru('Повторите пароль','Repeat password')"></span>
        <input type="password" class="field-input" x-model="f.password2"
               autocomplete="new-password" required></label>

      <label class="field"><span
            x-text="ru('Секретный вопрос для восстановления','Secret recovery question')"></span>
        <select class="field-input" x-model="f.sec_question">
          <template x-for="q in QUESTIONS" :key="q">
            <option :value="q" x-text="q"></option>
          </template>
        </select></label>
      <label class="field"><span
            x-text="ru('Ответ (без учёта регистра)','Answer (case-insensitive)')"></span>
        <input type="text" class="field-input" x-model="f.sec_answer"></label>
      <p class="alert error" x-show="err" x-text="err"></p>
    </div>

    <!-- Шаг 3: Внешний вид -->
    <div x-show="step===3" class="setup-body">
      <div class="sc-section-title"
           x-text="ru('Тема оформления','Theme')"></div>
      <div class="theme-grid anim-stagger">
        <div class="theme-card" :class="{sel: f.theme==='dark'}"
             @click="f.theme='dark'">
          <div class="theme-sw" style="background:#0F1115"></div>
          <span x-text="ru('Тёмная','Dark')"></span>
        </div>
        <div class="theme-card" :class="{sel: f.theme==='light'}"
             @click="f.theme='light'">
          <div class="theme-sw" style="background:#F5F6F8"></div>
          <span x-text="ru('Светлая','Light')"></span>
        </div>
      </div>
      <label class="remember-row" style="margin-top:14px">
        <input type="checkbox" class="cbx" x-model="f.load_demo">
        <span x-text="ru('Загрузить демонстрационные данные для знакомства',
                        'Load demo data to explore')"></span>
      </label>
      <p class="alert error" x-show="err" x-text="err"></p>
    </div>

    <div class="setup-nav">
      <button class="btn ghost-sm" x-show="step>1" @click="back()"
              x-text="ru('Назад','Back')"></button>
      <span class="flex1"></span>
      <button class="btn primary lg" @click="next()" :disabled="busy">
        <span class="spinner" x-show="busy"></span>
        <span x-show="!busy"
              x-text="step===3 ? ru('Создать и войти','Create & sign in')
                              : ru('Далее','Next')"></span>
      </button>
    </div>
  </div>
</div>
</template>

<!-- ═══════════ ЭКРАН 2: ВХОД / РЕГИСТРАЦИЯ ═══════════ -->
<template x-if="screen === 'auth'">
<div class="screen screen-auth">
  <div class="auth-card card">
    <div class="auth-head">
      <div class="brand-mark sm" x-html="icons.logo"></div>
      <h1 x-text="authMode === 'login' ? t('auth.loginTitle') : t('auth.regTitle')"></h1>
      <p class="muted" x-text="t('app.tagline')"></p>
    </div>

    <div class="seg">
      <button type="button" class="seg-btn" :class="{active: authMode==='login'}"
              @click="authMode='login'; error=''" x-text="t('auth.tabLogin')"></button>
      <button type="button" class="seg-btn" :class="{active: authMode==='register'}"
              @click="authMode='register'; error=''" x-text="t('auth.tabRegister')"></button>
    </div>

    <form @submit.prevent="submitAuth()" class="auth-form">
      <template x-if="authMode === 'register'">
        <label class="field">
          <span x-text="t('auth.fullName')"></span>
          <input type="text" x-model="regForm.full_name"
                 :placeholder="t('auth.fullNamePh')" autocomplete="name">
        </label>
      </template>
      <label class="field">
        <span x-text="t('auth.username')"></span>
        <input type="text" x-model="loginForm.username"
               :placeholder="t('auth.usernamePh')" autocomplete="username" required>
      </label>
      <label class="field">
        <span x-text="t('auth.password')"></span>
        <span class="pw-wrap">
          <input :type="showPassword ? 'text' : 'password'"
                 x-model="loginForm.password"
                 :placeholder="t('auth.passwordPh')"
                 autocomplete="current-password" required
                 @keydown="checkCaps($event)" @keyup="checkCaps($event)">
          <button type="button" class="pw-eye" @click="showPassword=!showPassword"
                  :title="t('auth.remember')"
                  x-html="showPassword ? icons.eyeOff : icons.eye"></button>
        </span>
      </label>
      <div class="caps-hint" x-show="capsOn && !showPassword"
           x-transition.opacity x-text="t('auth.capsLock')"></div>

      <template x-if="authMode === 'register'">
        <p class="hint" x-text="t('auth.isolationHint')"></p>
      </template>

      <div class="alert error" x-show="error" x-transition.opacity>
        <span x-text="error"></span>
      </div>

      <button type="submit" class="btn primary lg block" :disabled="busy">
        <span class="spinner" x-show="busy"></span>
        <span x-show="!busy"
              x-text="authMode === 'login' ? t('auth.enter') : t('auth.createAccount')"></span>
      </button>
    </form>

    <button type="button" class="link-btn muted"
            x-show="authMode==='login'"
            @click="$dispatch('suot-recover-open')"
            x-text="I18N.lang==='ru' ? 'Забыли пароль?' : 'Forgot password?'"></button>

    <!-- Восстановление пароля -->
    <div x-data="passwordRecovery()" x-cloak
         @suot-recover-open.window="open=true; stage=1; err=''"
         @keydown.escape.window="open && (open=false)">
      <template x-if="open">
        <div class="overlay" style="z-index:250">
          <div class="modal card sm anim-in" @click.stop>
            <h3 class="modal-title"
                x-text="ru('Восстановление пароля','Password recovery')"></h3>
            <template x-if="stage===1">
              <form @submit.prevent="findQuestion()" class="auth-form">
                <label class="field"><span x-text="t('auth.username')"></span>
                  <input type="text" class="field-input" x-model="f.username" required></label>
                <p class="alert error" x-show="err" x-text="err"></p>
                <div class="modal-foot">
                  <button type="button" class="btn" @click="open=false" x-text="t('tbl.cancel')"></button>
                  <button type="submit" class="btn primary" :disabled="busy"
                          x-text="ru('Найти вопрос','Find question')"></button>
                </div>
              </form>
            </template>
            <template x-if="stage===2">
              <form @submit.prevent="reset()" class="auth-form">
                <label class="field"><span x-text="question"></span>
                  <input type="text" class="field-input" x-model="f.answer" required></label>
                <label class="field"><span x-text="ru('Новый пароль','New password')"></span>
                  <input type="password" class="field-input" x-model="f.p1" required></label>
                <label class="field"><span x-text="ru('Повторите пароль','Repeat password')"></span>
                  <input type="password" class="field-input" x-model="f.p2" required></label>
                <p class="alert error" x-show="err" x-text="err"></p>
                <button type="submit" class="btn primary lg block" :disabled="busy"
                        x-text="ru('Сбросить пароль и войти','Reset & sign in')"></button>
              </form>
            </template>
          </div>
        </div>
      </template>
    </div>

    <label class="remember-row">
      <input type="checkbox" x-model="loginForm.remember" class="cbx">
      <span x-text="t('auth.remember')"></span>
    </label>

    <button class="linklike muted" @click="screen='lang'" x-text="t('common.back')"></button>
  </div>
</div>
</template>

<!-- ═══════════ ЭКРАН 3: ОСНОВНОЙ ИНТЕРФЕЙС ═══════════ -->
<template x-if="screen === 'main'">
<div class="shell">

  <!-- Боковая панель -->
  <aside class="sidebar" :class="{rail: railMode}">
    <div class="sidebar-brand">
      <template x-if="$store.brand && $store.brand.logo">
        <img :src="$store.brand.logo" class="brand-logo-img" alt="">
      </template>
      <template x-if="!($store.brand && $store.brand.logo)">
        <span class="brand-mark xs" x-html="icons.logo"></span>
      </template>
      <span class="brand-text"
            x-text="($store.brand && $store.brand.org_name)
              ? $store.brand.org_name : 'ПроОТ'"></span>
    </div>
    <nav class="nav">
      <button class="nav-item" :class="{active: $store.tabs.active &&
              $store.tabs.active.type==='welcome'}"
              @click="$store.tabs.openWelcome()"
              x-html="icons.dashboard + t('nav.dashboard')"></button>
      <div class="nav-sep" x-text="t('nav.groupData')"></div>
      <template x-for="item in [
        {key:'employees', icon:'users', label:t('nav.employees')},
        {key:'violations', icon:'alert', label:t('nav.violations')},
        {key:'incidents', icon:'inbox', label:I18N.lang==='ru'?'Происшествия':'Incidents'},
        {key:'ppe', icon:'hardhat', label:t('nav.ppe')},
        {key:'ppe_inspections', icon:'clipboard', label:I18N.lang==='ru'?'Осмотры СИЗ':'PPE insp.'},
        {key:'training', icon:'checkAll', label:I18N.lang==='ru'?'Обучение':'Training'},
        {key:'permits', icon:'command', label:I18N.lang==='ru'?'Допуски':'Permits'},
        {key:'work_orders', icon:'refresh', label:I18N.lang==='ru'?'Наряды':'Work orders'},
        {key:'companies', icon:'home', label:I18N.lang==='ru'?'Компании':'Companies'},
        {key:'custom_ledger', icon:'database', label:I18N.lang==='ru'?'Реестр':'Ledger'},
        {key:'checklists', icon:'checkAll', label:t('cl.checklists')},
        {key:'capa', icon:'linkIc', label:'CAPA'},
        {key:'protocols', icon:'fileText', label:I18N.lang==='ru'?'Протоколы':'Protocols'},
        {key:'risks', icon:'alert', label:I18N.lang==='ru'?'Риски':'Risks'},
        {key:'print_editor', icon:'fileText', label:I18N.lang==='ru'?'Печать':'Print'},
        {key:'textbook', icon:'bookmark', label:I18N.lang==='ru'?'Справочник':'Dictionary'},
      ]" :key="item.key">
        <button class="nav-item"
                :class="{active: $store.tabs.active &&
                         $store.tabs.active.key===item.key}"
                @click="$store.tabs.open(item.key)"
                @contextmenu.prevent="togglePin(item.key)"
                :title="I18N.lang==='ru' ? 'ПКМ — закрепить' : 'RMB — pin'">
          <span class="nav-ic" x-html="icons[item.icon]"></span>
          <span x-text="item.label"></span>
        </button>
      </template>
    </nav>
    <!-- Избранное -->
    <div class="nav-sep" x-show="pinned.length"
         x-text="I18N.lang==='ru' ? 'Избранное' : 'Pinned'"></div>
    <template x-for="pk in pinned" :key="'pin-' + pk">
      <button class="nav-item"
              :class="{active: $store.tabs.active && $store.tabs.active.key===pk}"
              @click="$store.tabs.open(pk)"
              @contextmenu.prevent="togglePin(pk)">
        <span class="nav-ic" style="color: var(--acc)"
              x-html="icons.bookmark"></span>
        <span x-text="$store.tabs.labelFor(pk)"></span>
      </button>
    </template>
    <!-- Мои таблицы -->
    <div class="nav-sep" x-show="customTables.length"
         x-text="I18N.lang==='ru' ? 'Мои таблицы' : 'My tables'"></div>
    <template x-for="ct in customTables" :key="ct.key">
      <button class="nav-item"
              :class="{active: $store.tabs.active && $store.tabs.active.key===ct.key}"
              @click="$store.tabs.open(ct.key)"
              @contextmenu.prevent="togglePin(ct.key)">
        <span class="nav-ic" :style="'color:' + ct.color"
              x-html="icons[ct.icon] || icons.database"></span>
        <span x-text="ct.label"></span>
      </button>
    </template>
    <div class="sidebar-foot">
      <button class="nav-item rail-toggle" @click="toggleRail()"
              :title="I18N.lang==='ru' ? 'Свернуть/развернуть меню' : 'Toggle menu'"
              x-html="icons.rows"></button>
      <button class="nav-item" @click="$store.tabs.openAI()"
              x-html="(icons.layers||'') + (I18N.lang==='ru'?'AI-ассистент':'AI Assistant')"></button>
      <button class="nav-item" @click="$store.tabs.openJournal()"
              x-html="(icons.fileText||'') + (I18N.lang==='ru'?'Журнал':'Audit log')"></button>
      <button class="nav-item" @click="$dispatch('suot-users-admin')"
              x-html="(icons.users||'') + (I18N.lang==='ru'?'Пользователи':'Users')"></button>
      <button class="nav-item" @click="toggleTheme()"
              x-html="(theme==='dark'?icons.sun:icons.moon) + (theme==='dark' ? t('nav.lightTheme') : t('nav.darkTheme'))"></button>
      <button class="nav-item danger" @click="logout()"
              x-html="icons.logout + t('nav.logout')"></button>
    </div>
  </aside>

  <!-- Основная область -->
  <main class="main">
    <!-- Топбар: глобальный поиск + пользователь -->
    <div class="topbar" x-show="screen==='main'">
      <div class="topsearch">
        <span x-html="icons.search" style="display:flex"></span>
        <input type="text" class="topsearch-input"
               x-ref="topsearch"
               :placeholder="I18N.lang==='ru' ? 'Поиск по всей программе…' : 'Search everything…'"
               @focus="$dispatch('suot-palette-open',
                 { q: $event.target.value })"
               @input="$dispatch('suot-palette-open',
                 { q: $event.target.value })"
               @keydown.enter.prevent="$event.target.value = '';
                 $event.target.blur()">
        <kbd>Ctrl K</kbd>
      </div>
      <span class="flex1"></span>
      <div class="userchip" x-data="{up:false}">
        <button class="userchip-btn" @click="up=!up">
          <span class="avatar"
                x-text="((user && user.username) || '?').slice(0,1).toUpperCase()"></span>
          <span x-text="user && user.username"></span>
        </button>
        <div class="user-pop card" x-show="up" x-transition.opacity
             @click.outside="up=false">
          <button class="more-item" @click="up=false; $store.tabs.openAI()">
            <span x-html="icons.layers"></span><span>AI-ассистент</span></button>
          <button class="more-item" @click="up=false; $store.tabs.openJournal()">
            <span x-html="icons.fileText"></span><span>Журнал</span></button>
          <button class="more-item" @click="up=false; $dispatch('suot-open-settings')">
            <span x-html="icons.settings"></span><span>Настройки</span></button>
          <button class="more-item" style="color:var(--err)"
                  @click="up=false; logout()">
            <span x-html="icons.logout"></span><span>Выйти</span></button>
        </div>
      </div>
    </div>

    <!-- Вкладки как в браузере -->
    <div class="tabbar">
      <div class="tabs-scroll">
        <template x-for="tb in $store.tabs.list" :key="tb.id">
          <div class="tab" :class="{active: tb.id===$store.tabs.activeId, 'type-welcome': tb.type==='welcome'}"
               @click="$store.tabs.activeId = tb.id"
               @auxclick.middle.prevent="$store.tabs.close(tb.id)">
            <span class="tab-icon"
                  x-html="tb.type==='welcome' ? icons.home : icons.database"></span>
            <span class="tab-title" x-text="tb.label"></span>
            <span class="tab-dot"
                  x-show="tb.type==='table' && $store.tabs._draftTick >= 0 && $store.tabs.hasDraft(tb.key)"
                  title="Есть черновик формы"></span>
            <button class="tab-x" @click.stop="$store.tabs.close(tb.id)"
                    x-html="icons.plus" :class="{rot45:true}"></button>
          </div>
        </template>
        <button class="tab-add" @click="openPalette()"
                title="Ctrl+K" x-html="icons.command"></button>
      </div>
    </div>

    <!-- Контент: панели вкладок -->
    <div class="content" @click.self="$store.tabs.active && null">
      <template x-for="tb in $store.tabs.list" :key="tb.id">
        <div class="tabpane" x-show="tb.id === $store.tabs.activeId">

          <!-- Добро пожаловать -->
          <template x-if="tb.type === 'welcome'">
            <section class="welcome">
              <div class="hero card">
                <h1><span x-text="t('welcome.hi')"></span>, <span class="grad"
                  x-text="user?.full_name || user?.username"></span> 👋</h1>
                <p x-text="t('welcome.subtitle')"></p>
                <div class="chips">
                  <span class="chip ok"><i></i><span x-text="t('welcome.apiOk')"></span></span>
                  <span class="chip" x-text="t('welcome.role') + ': ' + roleLabel()"></span>
                  <button class="chip cmd" @click="openPalette()">
                    <span x-html="icons.command"></span>
                    <kbd>Ctrl</kbd>+<kbd>K</kbd>
                  </button>
                </div>
              </div>

              <!-- ═══ РАБОЧИЙ СТОЛ ═══ -->
              <div class="card ws-card">
                <div class="ws-toolbar">
                  <b x-text="I18N.lang==='ru' ? 'Рабочий стол' : 'Workspace'"></b>
                  <div class="searchbox" style="width:220px">
                    <span class="sb-icon" x-html="icons.search"></span>
                    <input type="text" class="sb-input" x-model="wsSearch"
                           :placeholder="I18N.lang==='ru' ? 'Фильтр плиток…' : 'Filter tiles…'">
                  </div>
                  <span class="flex1"></span>
                  <select class="field-input" style="width:auto;font-size:12.5px"
                          x-model.number="$store.startScreen"
                          @change="localStorage.setItem('suot_start', $store.startScreen)"
                          :title="I18N.lang==='ru' ? 'Стартовый экран' : 'Start screen'">
                    <option value="workspace" x-text="I18N.lang==='ru' ? 'Старт: Рабочий стол' : 'Start: Workspace'"></option>
                    <option value="last" x-text="I18N.lang==='ru' ? 'Старт: последняя вкладка' : 'Start: last tab'"></option>
                  </select>
