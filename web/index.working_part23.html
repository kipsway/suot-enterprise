                                </label>
                              </template>
                              <div class="muted fp-empty" x-show="!filterValues.length">
                                —
                              </div>
                            </div>
                            <div class="fp-actions">
                              <button class="btn primary sm" @click="applyFilter()"
                                      x-text="t('tbl.apply')"></button>
                              <button class="linklike muted" @click="resetFilter()"
                                      x-text="t('tbl.resetFilter')"></button>
                            </div>
                          </div>
                        </th>
                      </template>
                      <th class="col-actions"></th>
                    </tr>
                    <!-- Быстрый фильтр -->
                    <tr class="qf-row" x-show="qfOn" x-transition.opacity>
                      <th class="qf-blank"></th>
                      <th class="qf-blank"></th>
                      <template x-for="c in visibleCols" :key="'qf-'+c.name">
                        <th class="qf-cell">
                          <input type="text" class="qf-input"
                                 x-model="qf[c.name]"
                                 :placeholder="t('qf.ph')"
                                 @click.stop @keydown.stop>
                        </th>
                      </template>
                      <th class="qf-blank"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-if="loading">
                      <tr>
                        <td :colspan="visibleCols.length + 3" class="skeleton-cell">
                          <div class="skel-row"></div><div class="skel-row w80"></div>
                          <div class="skel-row w60"></div>
                        </td>
                      </tr>
                    </template>
                    <template x-if="!loading">
                      <template x-for="item in displayRows()"
                                :key="item.grp ? ('g' + item.name)
                                       : ('r' + item.row.id)">
                        <tr @click="item.grp ? toggleGroup(item.name)
                                            : rowClick($event, item.row)"
                            :class="item.grp ? 'group-row'
                                    : {'sel': selected.has(item.row.id),
                                       ['lbl-' + rowLabel(item.row)]: !!rowLabel(item.row)}">
                          <template x-if="item.grp">
                            <td :colspan="visibleCols.length + 3">
                              <span class="gr-caret" x-text="item.open ? '▾' : '▸'"></span>
                              <b x-text="item.name"></b>
                              <span class="muted gr-cnt" x-text="'(' + item.count + ')'"></span>
                            </td>
                          </template>
                          <template x-if="!item.grp">
                            <td class="col-sel">
                              <input type="checkbox" class="cbx"
                                     :checked="selected.has(item.row.id)"
                                     @change="toggleRow(item.row.id)">
                            </td>
                          </template>
                          <template x-if="!item.grp">
                            <td class="col-id num" x-text="item.row.id"></td>
                          </template>
                          <template x-if="!item.grp">
                            <template x-for="c in dataCols" :key="c.name">
                              <td @dblclick="!isMedia(c) && startEdit(item.row, c)"
                                  @contextmenu.prevent="openCellComment(item.row, c)"
                                  :class="[{editable: editing===null && !isMedia(c)},
                                           fzClass(c), dateClass(item.row, c)]"
                                  :style="colStyle(c, false)">
                                <span class="cmt-dot" x-show="cmtOf(item.row, c)"
                                      :title="cmtOf(item.row, c)"></span>
                                <!-- Фото -->
                                <template x-if="isMedia(c) && cell(item.row, c)">
                                  <img class="tbl-thumb" :src="cell(item.row, c)"
                                       loading="lazy"
                                       @click="$dispatch('suot-lightbox', {src: cell(item.row, c)})">
                                </template>
                                <template x-if="isMedia(c) && !cell(item.row, c)">
                                  <span class="cell-text mediaEmpty">🖼</span>
                                </template>
                                <!-- Статусный бейдж -->
                                <template x-if="!isMedia(c) && isStatusCol(c) && cell(item.row, c)">
                                  <span class="badge"
                                        :class="badgeClass(cell(item.row, c))"
                                        x-text="cell(item.row, c)"></span>
                                </template>
                                <template x-if="!isMedia(c) && isStatusCol(c) && !cell(item.row, c)">
                                  <span class="cell-text"></span>
                                </template>
                                <!-- Обычные поля -->
                                <template x-if="!isMedia(c) && !isStatusCol(c) &&
                                                editing &&
                                                editing.id===item.row.id &&
                                                editing.col===c.name">
                                  <input type="text" class="cell-input"
                                         x-model="editing.value"
                                         @keydown.enter.prevent="saveInline()"
                                         @keydown.escape.prevent="cancelInline()"
                                         @blur="cancelInline()">
                                </template>
                                <template x-if="!isMedia(c) && !isStatusCol(c) &&
                                                !(editing && editing.id===item.row.id && editing.col===c.name)">
                                  <span class="cell-text"
                                        :class="{'overdue': isOverdue(item.row, c)}"
                                        x-text="cell(item.row, c)"></span>
                                </template>
                              </td>
                            </template>
                          </template>
                          <template x-if="!item.grp">
                            <td class="col-actions">
                              <button class="icon-btn" @click="openEdit(item.row)"
                                      :title="t('tbl.editTitle')"
                                      x-html="icons.pencil"></button>
                              <button class="icon-btn" @click="duplicateRecord(item.row)"
                                      :title="t('pv.duplicate')"
                                      x-html="icons.copyIc"></button>
                              <button class="icon-btn danger" @click="askDelete([item.row.id])"
                                      x-html="icons.trash"></button>
                            </td>
                          </template>
                        </tr>
                      </template>
                    </template>
                    <template x-if="!loading && rowsFiltered.length === 0">
                      <tr>
                        <td :colspan="visibleCols.length + 3" class="empty-cell">
                          <div class="empty-ic" x-html="icons.inbox"></div>
                          <div class="empty-title"
                               x-text="(q || activeFilterCount) ? t('tbl.emptyFiltered') : t('tbl.empty')"></div>
                          <div class="empty-hint muted" x-text="t('tbl.emptyHint')"></div>
                          <div class="empty-actions">
                            <button class="btn primary" @click="openAdd()"
                                    x-html="icons.plus + t('tbl.add')"></button>
                            <button class="btn" @click="seedDemo()" :disabled="seeding"
                                    x-html="icons.database + (seeding ? t('demo.seeding') : t('tbl.loadDemo'))"></button>
                          </div>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                <tfoot x-show="rowsFiltered.length && cardMode!=='cards'">
                  <tr class="agg-row">
                    <td class="agg-id" x-text="footerId()"></td>
                    <td></td>
                    <template x-for="c in dataCols" :key="'agg-'+c.name">
                      <td class="agg-cell muted"
                          :title="c.type==='Число' ? 'Сумма · среднее по странице' : 'Заполнено'"
                          x-text="footerAgg(c)"></td>
                    </template>
                    <td></td>
                  </tr>
                </tfoot>
                </table>
              </div>

              <!-- Карточный вид (Часть 21) -->
              <div class="cards-grid anim-stagger" x-show="cardMode==='cards'"
                   x-cloak>
                <template x-for="row in rowsFiltered" :key="row.id">
                  <div class="rec-card" @click="openEdit(row)">
                    <h4 x-text="cardTitle(row)"></h4>
                    <template x-for="c in visibleCols.slice(0, 6)"
                              :key="c.name">
                      <div class="rc-row"
                           x-show="(row.data[c.name] ?? '') !== ''">
                        <span class="muted" x-text="c.name"></span>
                        <b x-text="String(row.data[c.name] ?? '')"></b>
                      </div>
                    </template>
                  </div>
                </template>
                <p class="muted" x-show="!rowsFiltered.length"
                   style="grid-column:1/-1;text-align:center;padding:20px"
                   x-text="t('tbl.empty') || 'Нет записей'"></p>
              </div>

              <!-- Пагинация -->
              <div class="pagination" x-show="total > 0">
                <span class="pg-total muted">
                  <span x-text="t('tbl.total') + ': ' + total"></span>
                </span>
                <span class="flex1"></span>
                <label class="pg-size muted">
                  <span x-text="t('tbl.rowsPerPage')"></span>
                  <select x-model.number="pageSize" @change="changePageSize()">
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                  </select>
                </label>
                <button class="pg-btn" @click="page>1 && (page--, reload())"
                        :disabled="page<=1" x-html="icons.chevronUp" style="transform:rotate(-90deg)"></button>
                <template x-for="p in pageNumbers" :key="p">
                  <button class="pg-num" :class="{cur: p===page}"
                          @click="page=p; reload()" x-text="p"></button>
                </template>
                <button class="pg-btn" @click="page<pagesTotal && (page++, reload())"
                        :disabled="page>=pagesTotal" x-html="icons.chevronDown" style="transform:rotate(-90deg)"></button>
              </div>

              <!-- Диалог добавления/редактирования -->
              <template x-if="dialog">
                <div class="overlay" x-transition.opacity
                     @click.self="requestCloseDialog()"
                     @keydown.escape.window="requestCloseDialog()">
                  <div class="modal card anim-in" @click.stop>
                    <h3 class="modal-title"
                        x-text="dialog.mode==='add' ? t('tbl.addTitle') : t('tbl.editTitle')"></h3>
                    <!-- Шаблон нарушения (add) -->
                    <template x-if="dialog.mode==='add' && key==='violations' && templates.length">
                      <label class="field tpl-row">
                        <span x-text="t('tpl.choose')"></span>
                        <select x-model="tplChosen" @change="applyTemplate()">
                          <option value="">—</option>
                          <template x-for="tp in templates" :key="tp.id">
                            <option :value="String(tp.id)" x-text="tp.name"></option>
                          </template>
                        </select>
                      </label>
                    </template>
                    <div class="modal-body form-grid">
                      <template x-for="c in visibleCols" :key="c.name">
                        <div class="form-cell">
                          <!-- Обычное поле -->
                          <template x-if="!isMedia(c)">
                            <label class="field">
                              <span x-text="c.name"></span>
                              <input :type="inputType(c)"
                                     x-model="dialog.form[c.name]"
                                     @input="markDraft()">
                            </label>
                          </template>
                          <!-- Фото: dropzone -->
                          <template x-if="isMedia(c)">
                            <label class="field dz-field">
                              <span x-text="c.name"></span>
                              <div class="dz"
                                   :class="{filled: dialog.form[c.name]}"
                                   @dragover.prevent="$event.currentTarget.classList.add('dz-over')"
                                   @dragleave.prevent="$event.currentTarget.classList.remove('dz-over')"
                                   @drop.prevent="dzDrop($event, c.name)">
                                <template x-if="dialog.form[c.name]">
                                  <div class="dz-preview">
                                    <img :src="dialog.form[c.name]">
                                    <button type="button" class="icon-btn danger"
                                            @click.prevent="removePhoto(c.name)"
                                            x-html="icons.trash"></button>
                                  </div>
                                </template>
                                <template x-if="!dialog.form[c.name]">
                                  <div class="dz-empty">
                                    <span class="dz-ic" x-html="icons.upload"></span>
                                    <span class="dz-text" x-text="t('dz.drop')"></span>
                                    <span class="dz-or muted" x-text="t('dz.or')"></span>
                                    <button type="button" class="btn sm"
                                            @click.prevent="dzPick(c)"
                                            x-text="t('dz.browse')"></button>
                                  </div>
                                </template>
                                <span class="spinner dz-spin" x-show="dzBusy"></span>
                                <input type="file" accept="image/*" class="dz-file"
                                       :id="'dz-file-' + key + '-' + _colSlug(c.name)"
                                       @change="dzFiles($event, c.name)">
                              </div>
                            </label>
                          </template>
                        </div>
                      </template>
                    </div>
                    <div class="modal-foot">
                      <template x-if="dialog.mode==='edit' && !isCustom()">
                        <div class="panel-btns">
                          <button class="icon-btn" :title="t('rp.notes')"
                                  @click="openPanel('notes', {id: dialog.id})"
                                  x-html="icons.fileText"></button>
                          <button class="icon-btn" :title="t('rp.links')"
                                  @click="openPanel('links', {id: dialog.id})"
                                  x-html="icons.linkIc"></button>
                          <button class="icon-btn" :title="t('rp.history')"
                                  @click="openPanel('history', {id: dialog.id})"
                                  x-html="icons.clock"></button>
                        </div>
                      </template>
                      <span class="flex1"></span>
                      <button class="btn" @click="requestCloseDialog()"
                              x-text="t('tbl.cancel')"></button>
                      <button class="btn primary save-btn" @click="saveDialog()"
                              :disabled="dialogBusy">
                        <span class="spinner" x-show="dialogBusy"></span>
                        <span x-show="!dialogBusy" x-html="icons.checkAll + t('tbl.save')"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Диалог подтверждения удаления -->
              <template x-if="confirm">
                <div class="overlay" x-transition.opacity
                     @click.self="confirm=null"
                     @keydown.escape.window="confirm=null">
                  <div class="modal card sm anim-in" @click.stop>
                    <h3 class="modal-title danger-t"
                        x-text="confirm.selectedIds.length===1 ?
                          t('tbl.confirmDel1') :
                          t('tbl.confirmDelN').replace('{n}', confirm.selectedIds.length)"></h3>
                    <p class="muted modal-note" x-text="t('tbl.delNote')"></p>
                    <div class="modal-foot">
                      <button class="btn" @click="confirm=null"
                              x-text="t('tbl.cancel')"></button>
                      <button class="btn primary danger-btn" @click="doConfirm()"
                              :disabled="confirmBusy">
                        <span class="spinner" x-show="confirmBusy"></span>
                        <span x-show="!confirmBusy" x-html="icons.trash + t('tbl.deleteSel')"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Типы нарушений (справочник) -->
              <template x-if="typesOpen">
                <div class="overlay" x-transition.opacity
                     @click.self="typesOpen=false"
                     @keydown.escape.window="typesOpen=false">
                  <div class="modal card anim-in" @click.stop>
                    <h3 class="modal-title" x-text="t('vt.title')"></h3>
                    <div class="vt-add-row">
                      <input type="text" class="field-input"
                             x-model="typeForm.name"
                             :placeholder="t('vt.namePh')"
                             @keydown.enter.prevent="saveType()">
                      <select x-model="typeForm.risk_category">
                        <option>Низкая</option><option>Средняя</option>
                        <option>Высокая</option><option>Критическая</option>
                      </select>
                      <button class="btn primary sm" @click="saveType()"
                              x-text="typeEditId ? t('tbl.save') : t('vt.add')"></button>
                      <button class="linklike muted" x-show="typeEditId"
                              @click="typeEditId=null; typeForm={name:'',risk_category:'Средняя',description:''}"
                              x-text="t('tbl.cancel')"></button>
                    </div>
                    <p class="hint" x-show="!isAdminUser"
                       x-text="t('vt.onlyAdmin')"></p>
                    <div class="vt-list">
                      <template x-for="tp in types" :key="tp.id">
                        <div class="vt-item">
                          <span class="badge" :class="badgeClass(tp.risk_category)"
                                x-text="tp.risk_category"></span>
                          <span class="vt-name" x-text="tp.name"></span>
                          <span class="flex1"></span>
                          <button class="icon-btn" @click="editType(tp)"
                                  x-html="icons.pencil"></button>
                          <button class="icon-btn danger" @click="deleteType(tp)"
                                  x-html="icons.trash"></button>
                        </div>
                      </template>
                      <div class="muted fp-empty" x-show="!types.length"
                           x-text="t('vt.empty')"></div>
                    </div>
                    <div class="modal-foot">
                      <button class="btn" @click="typesOpen=false"
                              x-text="t('tbl.cancel')"></button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Панель записи: заметки / связи / история -->
              <template x-if="panel">
                <div class="overlay" x-transition.opacity
                     @click.self="panel=null"
                     @keydown.escape.window="panel=null">
                  <div class="modal card anim-in panel-modal" @click.stop>
                    <h3 class="modal-title"
                        x-text="t('rp.recordInfo').replace('{id}', panel.rowId)"></h3>
                    <div class="seg seg3">
                      <button type="button" class="seg-btn"
                              :class="{active: panel.tab==='notes'}"
                              @click="setPanelTab('notes')"
                              x-text="t('rp.notes')"></button>
                      <button type="button" class="seg-btn"
                              :class="{active: panel.tab==='links'}"
                              @click="setPanelTab('links')"
                              x-text="t('rp.links')"></button>
                      <button type="button" class="seg-btn"
                              :class="{active: panel.tab==='history'}"
                              @click="setPanelTab('history')"
                              x-text="t('rp.history')"></button>
                    </div>

                    <!-- Заметки -->
                    <div x-show="panel.tab==='notes'">
                      <div class="pn-add">
                        <input type="text" class="field-input"
                               x-model="panel.noteTitle"
                               :placeholder="t('rp.noteTitle')">
                        <textarea class="field-input" rows="2"
                                  x-model="panel.noteContent"
                                  :placeholder="t('rp.noteContent')"></textarea>
                        <button class="btn primary sm" @click="addNote()"
                                x-text="t('rp.addNote')"></button>
                      </div>
                      <div class="pn-list">
                        <template x-for="n in panel.items" :key="n.id">
                          <div class="pn-item">
                            <div class="pn-head">
                              <b x-text="n.title || '—'"></b>
                              <span class="muted pn-date"
                                    x-text="n.created_at"></span>
                              <button class="icon-btn danger"
                                      @click="delNote(n.id)"
                                      x-html="icons.trash"></button>
                            </div>
                            <div class="pn-body" x-text="n.content"></div>
                          </div>
                        </template>
                        <div class="muted fp-empty" x-show="!panel.items.length"
                             x-text="t('rp.empty')"></div>
                      </div>
                    </div>

                    <!-- Связи -->
                    <div x-show="panel.tab==='links'">
                      <div class="pn-add row">
                        <select x-model="panel.linkTable" style="flex:2">
                          <template x-for="tk in $store.tabs.TABLE_KEYS"
                                    :key="tk">
                            <option :value="tk"
                                    x-text="$store.tabs.labelFor(tk)"></option>
                          </template>
                        </select>
                        <input type="number" class="field-input" style="flex:1"
                               x-model="panel.linkId"
                               :placeholder="t('rp.recordId')">
                        <button class="btn primary sm" @click="addLink()"
                                x-text="t('rp.addTarget')"></button>
                      </div>
                      <div class="pn-list">
                        <template x-for="l in panel.items" :key="l.id">
                          <div class="pn-item row-item">
                            <span class="badge b-blue"
                                  x-text="$store.tabs.labelFor(l.target_table)"></span>
                            <b x-text="'#' + l.target_id"></b>
                            <span x-text="l.target_name"></span>
                            <span class="flex1"></span>
                            <button class="icon-btn danger"
                                    @click="delLink(l.id)"
                                    x-html="icons.trash"></button>
                          </div>
                        </template>
                        <div class="muted fp-empty" x-show="!panel.items.length"
                             x-text="t('rp.empty')"></div>
                      </div>
                    </div>

                    <!-- История -->
                    <div x-show="panel.tab==='history'">
                      <div class="pn-list">
                        <template x-for="h in panel.items" :key="h.id">
                          <div class="pn-item">
                            <div class="pn-head">
                              <b x-text="h.field"></b>
                              <span class="muted pn-date"
                                    x-text="h.created_at"></span>
                              <button class="btn ghost-sm"
                                      @click="rollbackHistory(h)"
                                      x-text="t('rp.rollback')"></button>
                            </div>
                            <div class="pn-body">
                              <span class="old" x-text="h.old_value"></span>
                              <span class="arrow">→</span>
                              <span class="new" x-text="h.new_value"></span>
                            </div>
                          </div>
                        </template>
                        <div class="muted fp-empty" x-show="!panel.items.length"
                             x-text="t('rp.empty')"></div>
                      </div>
                    </div>

                    <div class="modal-foot">
                      <button class="btn" @click="panel=null"
                              x-text="t('tbl.cancel')"></button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Возможный дубликат -->
              <template x-if="dupWarn">
                <div class="overlay" x-transition.opacity
                     @keydown.escape.window="dupWarn=null">
                  <div class="modal card sm anim-in" @click.stop>
                    <h3 class="modal-title warn-t" x-text="t('dup.title')"></h3>
                    <p class="modal-note"
                       x-text="t('dup.text').replace('{id}', dupWarn.id)"></p>
                    <div class="dup-preview" x-show="dupWarn.preview && dupWarn.preview.Описание">
                      <div x-text="(dupWarn.preview.Фирма || '') + ' ' + (dupWarn.preview.Дата || '')"></div>
                      <div class="muted" x-text="dupWarn.preview.Описание"></div>
                    </div>
                    <div class="modal-foot">
                      <button class="btn" @click="dupWarn=null"
                              x-text="t('tbl.cancel')"></button>
                      <button class="btn primary" @click="saveDupAnyway()"
                              x-text="t('dup.addAnyway')"></button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Панель-предпросмотр записи -->
              <template x-if="previewRow">
                <div class="pv-overlay" @keydown.escape.window="closePreview()">
                  <div class="pv-panel card anim-in" @click.stop @click.outside="closePreview()">
                    <div class="pv-head">
                      <span class="pv-title"
                            x-text="t('pv.title') + ' #' + previewRow.id"></span>
                      <button class="icon-btn" @click="closePreview()"
                              x-html="icons.plus"
                              style="transform:rotate(45deg)"></button>
                    </div>
                    <div class="pv-labels">
                      <span class="pv-lbl-cap muted" x-text="t('pv.label')"></span>
                      <button class="lbl-dot" :class="{on: !rowLabel(previewRow)}"
                              @click="setLabel(previewRow, '')"></button>
                      <template x-for="cl in ['red','orange','yellow','green','blue','purple']"
                                :key="cl">
                        <button class="lbl-dot" :class="[cl, {on: rowLabel(previewRow)===cl}]"
                                @click="setLabel(previewRow, cl)"></button>
                      </template>
                    </div>
                    <div class="pv-fields">
                      <template x-for="f in pvFields(previewRow)" :key="f.name">
                        <div class="pv-field" :class="{'pv-media': f.media}">
                          <span class="pv-cap" x-text="f.name"></span>
                          <template x-if="f.media && f.value">
                            <img class="pv-img" :src="f.value"
                                 @click="$dispatch('suot-lightbox', {src: f.value})">
                          </template>
                          <template x-if="f.media && !f.value">
                            <span class="muted" x-text="t('pv.empty')"></span>
                          </template>
                          <template x-if="!f.media && f.status && f.value">
                            <span class="badge" :class="badgeClass(f.value)"
                                  x-text="f.value"></span>
                          </template>
                          <template x-if="!f.media && !(f.status && f.value)">
                            <span class="pv-val"
                                  :class="{overdue: f.overdue}"
                                  x-text="f.value || t('pv.empty')"></span>
                          </template>
                        </div>
                      </template>
                    </div>
                    <div class="pv-actions">
                      <button class="btn primary" @click="pvEdit()"
                              x-html="icons.pencil + t('pv.edit')"></button>
                      <button class="btn" @click="pvDuplicate()"
                              x-html="icons.copyIc + t('pv.duplicate')"></button>
                      <button class="btn" @click="pvPanel('notes')"
                              x-html="icons.fileText"></button>
                      <button class="btn" @click="pvPanel('links')"
                              x-html="icons.linkIc"></button>
                      <button class="btn" @click="pvPanel('history')"
                              x-html="icons.clock"></button>
                      <span class="flex1"></span>
                      <button class="btn danger-sm" @click="askDelete([previewRow.id]); closePreview()"
                              x-html="icons.trash"></button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Массовое изменение поля -->
              <template x-if="bulkEditOpen">
                <div class="overlay" x-transition.opacity
                     @click.self="bulkEditOpen=false"
                     @keydown.escape.window="bulkEditOpen=false">
                  <div class="modal card sm anim-in" @click.stop>
                    <h3 class="modal-title" x-text="t('be.title')"></h3>
                    <p class="muted modal-note"
                       x-text="t('tbl.selectedN') + ': ' + selected.size"></p>
                    <label class="field">
                      <span x-text="t('be.field')"></span>
                      <select x-model="beField" class="field-input">
                        <template x-for="c in visibleCols" :key="c.name">
                          <option :value="c.name" x-text="c.name"></option>
                        </template>
                      </select>
                    </label>
                    <label class="field">
                      <span x-text="t('be.value')"></span>
                      <input type="text" x-model="beValue">
                    </label>
                    <div class="modal-foot">
                      <button class="btn" @click="bulkEditOpen=false"
                              x-text="t('tbl.cancel')"></button>
                      <button class="btn primary" @click="applyBulkEdit()"
                              x-text="t('be.apply')"></button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Черновик формы -->
              <template x-if="draftConfirm">
                <div class="overlay" x-transition.opacity
                     @keydown.escape.window="draftConfirm=null" style="z-index:260">
                  <div class="modal card sm anim-in" @click.stop>
                    <h3 class="modal-title" x-text="t('dr.confirm')"></h3>
                    <div class="modal-foot">
                      <button class="btn" @click="discardDraftAndClose()"
                              x-text="t('dr.discard')"></button>
                      <button class="btn primary" @click="saveDraftAndClose()"
                              x-text="t('dr.save')"></button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Менеджер колонок (Часть 8) -->
              <template x-if="colsMgmtOpen">
                <div class="overlay" x-transition.opacity
                     @click.self="colsMgmtOpen=false"
                     @keydown.escape.window="colsMgmtOpen=null; colsMgmtOpen=false">
                  <div class="modal card anim-in cm-modal" @click.stop>
                    <h3 class="modal-title"
                        x-text="I18N.lang==='ru' ? 'Колонки таблицы' : 'Table columns'"></h3>
                    <div class="seg" style="margin-bottom:14px">
                      <button type="button" class="seg-btn"
                              :class="{active: cmTab==='list'}"
                              @click="cmTab='list'"
                              x-text="I18N.lang==='ru' ? 'Список' : 'List'"></button>
                      <button type="button" class="seg-btn"
                              :class="{active: cmTab==='add'}"
                              @click="cmTab='add'"
                              x-text="I18N.lang==='ru' ? 'Добавить' : 'Add'"></button>
                    </div>

                    <!-- Список -->
                    <div x-show="cmTab==='list'" class="cm-list">
                      <template x-for="c in mergedForManager" :key="c.name">
                        <div class="cm-row">
                          <span class="col-type-ic" x-html="typeIcon(c)"></span>
                          <template x-if="cmRenameId && cmRenameId===c.id">
                            <input type="text" class="field-input" style="flex:1"
                                   x-model="cmRenameVal"
                                   @keydown.enter.prevent="cmRename(c.id, c.name)">
                          </template>
                          <template x-if="!(cmRenameId && cmRenameId===c.id)">
                            <b style="flex:1" x-text="c.name"></b>
                          </template>
                          <span class="muted cm-type" x-text="c.type"></span>
                          <span class="badge" :class="c.source==='my' ? 'b-purple' : 'b-gray'"
                                x-text="c.source==='my' ? (I18N.lang==='ru' ? 'моя' : 'mine') : (I18N.lang==='ru' ? 'системная' : 'system')"></span>
                          <span class="flex1"></span>
                          <!-- скрыть/показать (системные + свои) -->
                          <button class="icon-btn" :class="{off: c.source==='sys' && c.hidden}"
                                  @click="c.source==='sys' ? toggleHidden(c.name) : cmPatch(c.id, {visible: !c.visible})"
                                  :title="I18N.lang==='ru' ? 'Скрыть/показать' : 'Hide/show'"
                                  x-html="c.source==='sys' ? (c.hidden ? icons.eyeOff : icons.eye) : (c.visible ? icons.eye : icons.eyeOff)"></button>
                          <!-- переименовать/дублировать/удалить — только свои -->
                          <template x-if="c.source==='my'">
                            <button class="icon-btn" @click="cmRenameId=c.id; cmRenameVal=c.name"
                                    x-html="icons.pencil"></button>
                          </template>
                          <template x-if="c.source==='my' && c.type!=='Вычисляемая'">
                            <button class="icon-btn" @click="cmDupId=c.id; cmDupName=c.name + ' копия'"
                                    :title="t('col.dup')"
                                    x-html="icons.copyIc"></button>
                          </template>
                          <template x-if="c.source==='my'">
                            <button class="icon-btn danger" @click="cmDelete(c.id)"
                                    x-html="icons.trash"></button>
                          </template>
                          <!-- inline-формы -->
                          <template x-if="cmDupId && cmDupId===c.id">
                            <div class="cm-inline">
                              <input type="text" class="field-input"
                                     x-model="cmDupName"
                                     @keydown.enter.prevent="cmDuplicate(c.id)">
                              <button class="btn primary sm" @click="cmDuplicate(c.id)"
                                      x-text="t('col.dup')"></button>
                              <button class="linklike muted" @click="cmDupId=null"
                                      x-text="t('tbl.cancel')"></button>
                            </div>
                          </template>
                        </div>
                      </template>
                      <p class="hint" x-show="cmRenameId"
                         x-text="I18N.lang==='ru' ? 'Введите новое имя и нажмите Enter' : 'Type new name and press Enter'"></p>
                    </div>

                    <!-- Добавление с предпросмотром (предложение 1) -->
                    <div x-show="cmTab==='add'">
                      <label class="field"><span x-text="I18N.lang==='ru' ? 'Название' : 'Name'"></span>
                        <input type="text" x-model="cmForm.name"></label>
                      <label class="field"><span x-text="I18N.lang==='ru' ? 'Тип' : 'Type'"></span>
                        <select class="field-input" x-model="cmForm.type">
                          <option>Текст</option><option>Число</option>
                          <option>Дата</option><option>Годен до</option>
                          <option>Дата проведения</option><option>Статус</option>
                          <option>Чекбокс</option><option>Деньги</option>
                          <option>Вычисляемая</option>
                        </select></label>
                      <label class="field" x-show="cmForm.type==='Вычисляемая'">
                        <span x-text="I18N.lang==='ru' ? 'Шаблон: {Колонка1} {Колонка2}' : 'Template: {Col1} {Col2}'"></span>
                        <input type="text" x-model="cmForm.template"
                               :placeholder="I18N.lang==='ru' ? '{ФИО} ({Должность})' : '{Name} ({Position})'">
                        <div class="chips" style="margin-top:6px">
                          <template x-for="cn in visibleCols.map(x=>x.name)" :key="'chip-'+cn">
                            <button type="button" class="chip cmd"
                                    @click="cmForm.template += '{' + cn + '} '"
                                    x-text="'{'+cn+'}'"></button>
                          </template>
                        </div>
                      </label>
                      <!-- Предпросмотр -->
                      <div class="cm-preview">
                        <b class="sp-cap" style="margin-top:0"
                           x-text="I18N.lang==='ru' ? 'Предпросмотр' : 'Preview'"></b>
                        <table class="grid" style="font-size:12.5px">
                          <thead><tr>
                            <th><span class="col-type-ic" x-html="typeIcon(cmForm)"></span>
                                <span x-text="cmForm.name || '—'"></span></th>
                          </tr></thead>
                          <tbody><tr><td>
                            <span x-text="cmPreview() || '—'"></span>
                          </td></tr></tbody>
                        </table>
                      </div>
                      <div class="modal-foot">
                        <button class="btn" @click="cmTab='list'"
                                x-text="t('tbl.cancel')"></button>
                        <button class="btn primary" @click="cmAdd()"
                                x-text="t('tbl.add')"></button>
                      </div>
                    </div>
                    <div class="modal-foot" x-show="cmTab==='list'">
                      <button class="btn" @click="colsMgmtOpen=false"
                              x-text="t('tbl.cancel')"></button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Перенос записей -->
              <template x-if="transferOpen">
                <div class="overlay" x-transition.opacity
                     @click.self="transferOpen=false"
                     @keydown.escape.window="transferOpen=false">
                  <div class="modal card sm anim-in" @click.stop>
                    <h3 class="modal-title"
                        x-text="I18N.lang==='ru' ? 'Перенос записей' : 'Move records'"></h3>
                    <p class="muted modal-note"
                       x-text="t('tbl.selectedN') + ': ' + selected.size"></p>
                    <label class="field">
                      <span x-text="I18N.lang==='ru' ? 'Целевая таблица' : 'Target table'"></span>
                      <select class="field-input" x-model="transferTo">
                        <template x-for="tt in transferTargets" :key="tt.key">
                          <option :value="tt.key" x-text="tt.label"></option>
                        </template>
                      </select>
                    </label>
                    <label class="remember-row">
                      <input type="checkbox" class="cbx" x-model="transferMove">
                      <span x-text="I18N.lang==='ru' ? 'Удалить из исходной таблицы (переместить)' : 'Remove from source (move)'"></span>
                    </label>
                    <div class="modal-foot">
                      <button class="btn" @click="transferOpen=false"
                              x-text="t('tbl.cancel')"></button>
                      <button class="btn primary" @click="doTransfer()"
                              x-text="I18N.lang==='ru' ? 'Перенести' : 'Move'"></button>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Контекстное меню сортировки (ПКМ по заголовку) -->
              <template x-if="ctx">
                <div class="ctx-overlay" @click="ctx=null"
                     @contextmenu.prevent="ctx=null">
                  <div class="ctx-menu card anim-in"
                       :style="'left:' + Math.min(ctx.x, window.innerWidth-190) + 'px; top:' +
                               Math.min(ctx.y, window.innerHeight-170) + 'px'"
                       @click.stop>
                    <button class="ctx-item" @click="ctxSort('asc','')"
                            x-text="t('sm.asc')"></button>
                    <button class="ctx-item" @click="ctxSort('desc','')"
                            x-text="t('sm.desc')"></button>
                    <div class="ctx-sep"></div>
                    <button class="ctx-item" @click="ctxSort('asc','num')"
                            x-text="t('sm.numAsc')"></button>
                    <button class="ctx-item" @click="ctxSort('desc','num')"
                            x-text="t('sm.numDesc')"></button>
                  </div>
                </div>
              </template>

              <!-- Комментарий к ячейке (Часть 23) -->
              <template x-if="cellCmt">
                <div class="overlay" x-transition.opacity
                     @click.self="cellCmt=null"
                     @keydown.escape.window="cellCmt=null">
                  <div class="modal card sm anim-in" @click.stop>
                    <h3 class="modal-title"
                        x-text="ru('Комментарий к ячейке','Cell comment')"></h3>
                    <p class="muted modal-note"
                       x-text="'#' + cellCmt.rowId + ' · ' + cellCmt.col"></p>
                    <textarea class="field-input" rows="4"
                              x-model="cellCmt.text"
                              :placeholder="ru('Заметка к этой ячейке…','Note for this cell…')"></textarea>
                    <div class="modal-foot">
                      <button class="btn" @click="cellCmt=null"
                              x-text="t('tbl.cancel')"></button>
                      <button class="btn primary" @click="saveCellComment()"
                              x-text="t('tbl.save')"></button>
                    </div>
                  </div>
                </div>
              </template>

            </div>
          </template>

          <!-- ═══ STRUCTURED: чек-листы / CAPA / протоколы / риски / справочник ═══ -->
          <template x-if="tb.type === 'table' && STRUCTURED_PAGES[tb.key]">
            <div x-data="resolvePage(tb.key)" x-init="init()">

              <!-- Чек-листы -->
              <template x-if="tb.key === 'checklists'">
                <div class="sp-wrap">
                  <div class="sp-toolbar">
                    <button class="btn primary" @click="openCreate()"
                            x-html="icons.plus + t('cl.new')"></button>
                    <button class="btn" @click="openCreate(); form.is_template=true"
                            x-html="icons.layers + t('cl.templates')"></button>
                    <span class="flex1"></span>
                    <div class="seg" style="margin-bottom:0">
                      <button type="button" class="seg-btn" :class="{active: mode==='all'}"
                              @click="setMode('all')" x-text="t('cl.all')"></button>
                      <button type="button" class="seg-btn" :class="{active: mode==='checklists'}"
                              @click="setMode('checklists')" x-text="t('cl.checklists')"></button>
                      <button type="button" class="seg-btn" :class="{active: mode==='templates'}"
                              @click="setMode('templates')" x-text="t('cl.templates')"></button>
                    </div>
                  </div>
                  <div class="sp-cols">
                    <div class="sp-list card">
                      <template x-for="c in list" :key="c.id">
                        <button class="sp-item" :class="{on: cur && cur.id===c.id}"
                                @click="open(c.id)">
                          <span x-text="c.title"></span>
                          <span class="muted sp-meta">
                            <span x-text="c.items_count"></span>
                            <span class="badge" :class="c.is_template ? 'b-purple' : 'b-blue'"
                                  x-text="c.is_template ? t('cl.templates') : t('cl.checklists')"></span>
                          </span>
                        </button>
                      </template>
                      <div class="muted fp-empty" x-show="!list.length">—</div>
                    </div>
                    <div class="sp-detail card" x-show="cur">
                      <template x-if="cur">
                        <div class="sp-detail-in">
                          <div class="pv-head">
                            <b x-text="cur.title"></b>
                            <span class="flex1"></span>
                            <button class="icon-btn" @click="openEdit()"
                                    x-html="icons.pencil"></button>
                            <button class="icon-btn danger" @click="remove()"
                                    x-html="icons.trash"></button>
                          </div>
                          <p class="muted" x-text="cur.description"></p>
                          <div class="sp-actions">
                            <button class="btn primary" @click="startFill()"
                                    x-show="!cur.is_template && !fillMode"
                                    x-html="icons.checkAll + t('cl.fill')"></button>
                            <button class="btn" @click="saveAsTemplate()"
                                    x-html="icons.layers + t('cl.saveAsTpl')"></button>
                            <button class="btn" x-show="cur.is_template"
                                    @click="createFromTemplate()"
                                    x-html="icons.copyIc + t('cl.fromTpl')"></button>
                          </div>
                          <!-- Заполнение -->
                          <template x-if="fillMode"><div class="fill-box">
                            <label class="field"><span x-text="t('cl.conductedBy')"></span>
                              <input type="text" x-model="fillBy"></label>
                            <template x-for="i in items" :key="i.id">
                              <div class="fill-item">
                                <span class="fill-text" x-text="i.item_text"></span>
                                <div class="fill-ctrl">
                                  <label class="fill-opt ok"><input type="radio" class="cbx"
                                    :name="'f'+i.id" value="ok"
                                    :checked="fill[i.id] && fill[i.id].value==='ok'"
                                    @change="fill[i.id].value='ok'"><span x-text="t('cl.ok')"></span></label>
                                  <label class="fill-opt fail"><input type="radio" class="cbx"
                                    :name="'f'+i.id" value="fail"
                                    :checked="fill[i.id] && fill[i.id].value==='fail'"
                                    @change="fill[i.id].value='fail'"><span x-text="t('cl.fail')"></span></label>
                                  <label class="fill-opt"><input type="radio" class="cbx"
                                    :name="'f'+i.id" value="na"
                                    :checked="fill[i.id] && fill[i.id].value==='na'"
                                    @change="fill[i.id].value='na'"><span x-text="t('cl.na')"></span></label>
                                </div>
                                <input type="text" class="field-input" style="margin-top:6px"
                                       :placeholder="t('cl.notes')"
                                       x-model="fill[i.id].comment">
                              </div>
                            </template>
                            <label class="field"><span x-text="t('cl.notes')"></span>
                              <input type="text" x-model="fillNotes"></label>
                            <div class="sp-actions">
                              <button class="btn primary" @click="saveFill()"
                                      x-html="icons.checkAll + t('tbl.save')"></button>
                              <button class="btn" @click="fillMode=false"
                                      x-text="t('tbl.cancel')"></button>
                            </div>
                          </div></template>
                          <!-- Пункты -->
                          <div x-show="!fillMode">
                            <b class="sp-cap" x-text="t('cl.items')"></b>
                            <ol class="cl-items">
                              <template x-for="i in items" :key="i.id">
                                <li x-text="i.item_text"></li>
                              </template>
                            </ol>
                            <b class="sp-cap" x-text="t('cl.results')"></b>
                            <div class="res-list">
                              <template x-for="r in results" :key="r.id">
                                <div class="res-item">
                                  <span class="badge" :class="SP.badge(r.status)"
                                        x-text="r.status"></span>
                                  <span x-text="r.conducted_date"></span>
                                  <span class="muted" x-text="r.conducted_by"></span>
                                  <span class="flex1"></span>
                                  <button class="icon-btn danger"
                                          @click="delResult(r.id)"
                                          x-html="icons.trash"></button>
                                </div>
                              </template>
                              <div class="muted fp-empty" x-show="!results.length">—</div>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                  <!-- Диалог создания/редактирования чек-листа -->
                  <template x-if="editOpen">
                    <div class="overlay" x-transition.opacity
                         @click.self="editOpen=false"
                         @keydown.escape.window="editOpen=false">
                      <div class="modal card anim-in" @click.stop>
                        <h3 class="modal-title"
                            x-text="cur && cur.id ? t('tbl.editTitle') : t('cl.new')"></h3>
                        <label class="field"><span x-text="t('prot.topic')"></span>
                          <input type="text" x-model="form.title"></label>
                        <label class="field"><span x-text="t('cl.notes')"></span>
                          <input type="text" x-model="form.description"></label>
                        <label class="remember-row">
                          <input type="checkbox" class="cbx" x-model="form.is_template">
                          <span x-text="t('cl.templates')"></span>
                        </label>
                        <b class="sp-cap" x-text="t('cl.items')"></b>
                        <div class="item-rows">
                          <template x-for="(txt, idx) in itemTexts" :key="idx">
                            <div class="item-row">
                              <input type="text" class="field-input"
                                     x-model="itemTexts[idx]"
                                     :placeholder="t('cl.items') + ' ' + (idx+1)">
                              <button class="icon-btn danger" x-show="itemTexts.length > 1"
                                      @click="itemTexts.splice(idx,1)"
                                      x-html="icons.trash"></button>
                            </div>
                          </template>
                          <button class="linklike" @click="itemTexts.push('')"
                                  x-text="'+ ' + t('cl.items')"></button>
                        </div>
                        <div class="modal-foot">
                          <button class="btn" @click="editOpen=false"
                                  x-text="t('tbl.cancel')"></button>
                          <button class="btn primary" @click="saveEdit()"
                                  x-text="t('tbl.save')"></button>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </template>

              <!-- CAPA -->
              <template x-if="tb.key === 'capa'">
                <div class="sp-wrap">
                  <div class="sp-toolbar">
                    <button class="btn primary" @click="openCreate()"
                            x-html="icons.plus + t('capa.new')"></button>
                    <span class="flex1"></span>
                    <select class="field-input" style="width:auto"
                            x-model="statusFilter" @change="load()">
                      <option value="">—</option>
                      <option value="open">open</option>
                      <option value="in_progress">in_progress</option>
                      <option value="verified">verified</option>
                      <option value="closed">closed</option>
                    </select>
                  </div>
                  <div class="capa-list">
                    <template x-for="r in list" :key="r.id">
                      <div class="card capa-row">
                        <span class="badge" :class="sevBadge(r.severity)"
                              x-text="r.severity"></span>
                        <span class="badge" :class="stBadge(r.status)"
                              x-text="r.status"></span>
                        <b x-text="r.title"></b>
                        <span class="muted" x-text="r.assigned_to"></span>
                        <span class="muted" :class="{overdue: r.deadline}"
                              x-text="r.deadline"></span>
                        <span class="flex1"></span>
                        <button class="btn ghost-sm" @click="openChain(r)"
                                x-html="icons.linkIc + t('capa.chain')"></button>
                        <button class="icon-btn" @click="openEdit(r)"
                                x-html="icons.pencil"></button>
                        <button class="icon-btn danger" @click="remove(r)"
                                x-html="icons.trash"></button>
                      </div>
                    </template>
                    <div class="muted fp-empty" x-show="!list.length">—</div>
                  </div>
                  <!-- Диалог CAPA -->
                  <template x-if="dialog">
                    <div class="overlay" x-transition.opacity
                         @click.self="dialog=null"
                         @keydown.escape.window="dialog=null">
                      <div class="modal card anim-in" @click.stop>
                        <h3 class="modal-title"
                            x-text="dialog.id ? t('tbl.editTitle') : t('capa.new')"></h3>
                        <label class="field"><span x-text="t('prot.topic')"></span>
                          <input type="text" x-model="form.title"></label>
                        <label class="field"><span x-text="t('capa.st1')"></span>
                          <textarea class="field-input" rows="2" x-model="form.description"></textarea></label>
