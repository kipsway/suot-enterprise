                    </template>
                    <div class="ai-msg assistant"
                         x-show="busy && messages.length &&
                                 !messages[messages.length-1].content">
                      <div class="ai-bubble"><span class="spinner"></span></div>
                    </div>
                    <div class="muted ai-hello" x-show="!messages.length && !busy"
                         style="text-align:center;margin-top:40px;font-size:14px"
                         x-text="ru('Спросите о ваших данных: «сколько просроченных осмотров?», '+
                                    '\'создай нарушение для Иванова\'…',
                                    'Ask about your data…')"></div>
                  </div>

                  <template x-if="agentConfirm">
                    <div class="ai-agent-confirm card">
                      <b x-text="ru('AI предлагает действие:','AI proposes:')"></b>
                      <code x-text="agentConfirm.action + ' ' +
                        JSON.stringify(agentConfirm.params).slice(0, 140)"></code>
                      <div class="sp-actions" style="margin-top:8px">
                        <button class="btn primary sm"
                                @click="agentExecute(agentConfirm.action, agentConfirm.params)"
                                x-text="ru('Подтвердить','Confirm')"></button>
                        <button class="btn ghost-sm" @click="dismissAgent()"
                                x-text="ru('Отмена','Cancel')"></button>
                      </div>
                    </div>
                  </template>

                  <div class="ai-input-row">
                    <input type="text" class="field-input" :id="'ai-chat-input'"
                           x-model="input"
                           :placeholder="ru('Спросите о данных…','Ask about your data…')"
                           @keydown.enter.prevent="send()" :disabled="busy">
                    <button class="btn primary" @click="send()"
                            :disabled="busy || !input.trim()">
                      <span x-html="icons.chevronUp"></span>
                    </button>
                  </div>
                </div>
              </template>

<!-- ЖУРНАЛ АУДИТА (Часть 18) -->
              <template x-if="tb.type === 'journal'">
                <div x-data="journalView()" x-init="init()">
                  <div class="sp-wrap">
                    <div class="tbl-toolbar">
                      <input type="text" class="field-input jn-q"
                             style="max-width:260px"
                             :placeholder="ru('Поиск по событиям…', 'Search events…')"
                             x-model="q" @keydown.enter="reload()">
                      <select class="field-input" style="max-width:150px"
                              x-model="severity" @change="reload()">
                        <option value="" x-text="ru('Все уровни','All levels')"></option>
                        <option value="INFO">INFO</option>
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                      </select>
                      <button class="btn" @click="reload()"
                              x-text="ru('Обновить','Refresh')"></button>
                      <span class="flex1"></span>
                      <span class="muted" x-text="'Всего: ' + total"></span>
                      <button class="btn primary" @click="exportCsv()"
                              x-text="ru('Экспорт CSV','Export CSV')"></button>
                    </div>
                    <div class="card tablewrap">
                      <table class="grid">
                        <thead><tr>
                          <th x-text="ru('Время','Time')"></th>
                          <th x-text="ru('Событие','Event')"></th>
                          <th x-text="ru('Уровень','Level')"></th>
                          <th x-text="ru('Пользователь','User')"></th>
                        </tr></thead>
                        <tbody>
                          <template x-for="it in items" :key="it.id">
                            <tr>
                              <td class="jn-ts" x-text="(it.timestamp||'').slice(0,19).replace('T',' ')"></td>
                              <td x-text="it.event"></td>
                              <td><span class="jn-sev" :class="sevClass(it.severity)"
                                        x-text="it.severity"></span></td>
                              <td x-text="it.username || '—'"></td>
                            </tr>
                          </template>
                          <tr x-show="!items.length && !loading">
                            <td colspan="4" class="muted"
                                x-text="ru('Событий пока нет','No events yet')"></td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                    <div style="text-align:center;padding:10px">
                      <button class="btn ghost-sm" x-show="items.length < total"
                              @click="more()"
                              x-text="ru('Показать ещё','Load more')"></button>
                    </div>
                  </div>
                </div>
              </template>

        </div>
      </template>
    </div>

    <!-- Статус-бар -->
    <footer class="statusbar">
      <span class="dot" :class="apiOk === false ? 'err' : 'ok'"
            :title="apiOk === false ? 'Нет связи с API' : 'API подключён'"></span>
      <span x-text="'API · v' + (appVersion || '…')"></span>
      <span class="sep">•</span>
      <span x-text="user?.username"></span>
      <span class="sep">•</span>
      <span x-show="$store.tabs.active" x-text="$store.tabs.active?.label"></span>
      <span class="flex1"></span>
      <button class="statusbar-cmd" @click="openPalette()">
        <kbd>Ctrl</kbd>+<kbd>K</kbd>
      </button>
      <button class="statusbar-cmd" @click="Sounds.toggle()"
              :title="I18N.lang==='ru' ? 'Звуки' : 'Sounds'"
              x-text="Sounds.enabled ? '🔊' : '🔇'"></button>
      <button class="statusbar-cmd" @click="$dispatch('suot-ai-chat')"
              title="AI" x-html="icons.layers"></button>
      <button class="statusbar-cmd" @click="$dispatch('suot-open-settings')"
              :title="I18N.lang==='ru' ? 'Настройки' : 'Settings'"
              x-html="icons.settings"></button>
    </footer>
    <button id="toTopBtn" x-cloak x-show="showTop" x-transition.opacity
            @click="toTop()" title="Наверх"
            x-html="icons.chevronDown"
            style="transform:rotate(180deg)"></button>
  </main>
</div>
</template>

<!-- ═══ МОДАЛКИ РАБОЧЕГО СТОЛА ═══ -->
<template x-if="ctOpen">
  <div class="overlay" x-transition.opacity @click.self="ctOpen=false"
       @keydown.escape.window="ctOpen=null; ctOpen=false">
    <div class="modal card anim-in" @click.stop>
      <h3 class="modal-title"
          x-text="ctEditKey ? (I18N.lang==='ru' ? 'Настройки таблицы' : 'Table settings')
                  : (I18N.lang==='ru' ? 'Новая таблица' : 'New table')"></h3>
      <label class="field">
        <span x-text="I18N.lang==='ru' ? 'Название' : 'Name'"></span>
        <input type="text" x-model="ctForm.label"
               :placeholder="I18N.lang==='ru' ? 'Например: Склад' : 'e.g. Warehouse'">
      </label>
      <label class="field">
        <span x-text="I18N.lang==='ru' ? 'Иконка' : 'Icon'"></span>
        <div class="icon-picker">
          <template x-for="ic in ctIcons" :key="ic">
            <button type="button" class="ip-btn"
                    :class="{on: ctForm.icon===ic}"
                    :style="ctForm.icon===ic ? 'color:' + ctForm.color : ''"
                    @click="ctForm.icon=ic"
                    x-html="icons[ic]"></button>
          </template>
        </div>
      </label>
      <label class="field">
        <span x-text="I18N.lang==='ru' ? 'Цвет' : 'Color'"></span>
        <div class="color-row">
          <template x-for="cl in ctColors" :key="cl">
            <button type="button" class="lbl-dot" :class="{on: ctForm.color===cl}"
                    :style="'background:' + cl"
                    @click="ctForm.color=cl"></button>
          </template>
        </div>
      </label>
      <b class="sp-cap" x-text="I18N.lang==='ru' ? 'Колонки' : 'Columns'"></b>
      <div class="item-rows">
        <template x-for="(col, idx) in ctForm.columns" :key="idx">
          <div class="item-row">
            <input type="text" class="field-input" style="flex:2"
                   x-model="col.name"
                   :placeholder="I18N.lang==='ru' ? 'Название колонки' : 'Column name'">
            <select class="field-input" style="flex:1" x-model="col.type">
              <option>Текст</option><option>Число</option>
              <option>Дата</option><option>Годен до</option>
              <option>Дата проведения</option><option>Статус</option>
              <option>Чекбокс</option><option>Деньги</option>
            </select>
            <button type="button" class="icon-btn danger"
                    x-show="ctForm.columns.length > 1"
                    @click="ctForm.columns.splice(idx,1)"
                    x-html="icons.trash"></button>
          </div>
        </template>
        <button type="button" class="linklike"
                @click="ctForm.columns.push({name:'',type:'Текст'})"
                x-text="'+ ' + (I18N.lang==='ru' ? 'колонка' : 'column')"></button>
      </div>
      <div class="modal-foot">
        <button class="btn danger-sm" x-show="ctEditKey"
                @click="trashCustomTable(ctEditKey)"
                x-text="I18N.lang==='ru' ? 'В корзину' : 'To trash'"></button>
        <span class="flex1"></span>
        <button class="btn" @click="ctOpen=false" x-text="t('tbl.cancel')"></button>
        <button class="btn primary" @click="saveCustomTable()" :disabled="ctBusy"
                x-text="t('tbl.save')"></button>
      </div>
    </div>
  </div>
</template>

<template x-if="trashOpen">
  <div class="overlay" x-transition.opacity @click.self="trashOpen=false"
       @keydown.escape.window="trashOpen=false">
    <div class="modal card anim-in" @click.stop>
      <h3 class="modal-title"
          x-text="I18N.lang==='ru' ? 'Корзина таблиц (30 дней)' : 'Table trash (30 days)'"></h3>
      <div class="pn-list">
        <template x-for="t in trashList" :key="t.key">
          <div class="pn-item row-item">
            <span class="nav-ic" :style="'color:' + t.color"
                  x-html="icons[t.icon] || icons.database"></span>
            <b x-text="t.label"></b>
            <span class="muted" x-text="t.deleted_at"></span>
            <span class="flex1"></span>
            <button class="btn ghost-sm" @click="restoreTrash(t)"
                    x-text="I18N.lang==='ru' ? 'Восстановить' : 'Restore'"></button>
            <label class="fill-opt" style="font-size:11.5px">
              <input type="checkbox" class="cbx"
                     :checked="true" x-model="t._csv">
              <span x-text="I18N.lang==='ru' ? 'CSV' : 'CSV'"></span>
            </label>
            <button class="icon-btn danger" @click="purgeTrash(t, t._csv !== false)"
                    x-html="icons.trash"></button>
          </div>
        </template>
        <div class="muted fp-empty" x-show="!trashList.length"
             x-text="I18N.lang==='ru' ? 'Корзина пуста' : 'Trash is empty'"></div>
      </div>
      <div class="modal-foot">
        <button class="btn" @click="trashOpen=false" x-text="t('tbl.cancel')"></button>
      </div>
    </div>
  </div>
</template>

<!-- ═══ МАСТЕР ИМПОРТА (Часть 9) ═══ -->
<div x-data="importWizard()" x-cloak
     @suot-import.window="openW($event.detail.key)"
     @keydown.escape.window="open && close()">
  <div class="overlay" x-show="open" style="display:none" x-show="open" x-transition.opacity x-cloak
       @click.self="close()">
    <div class="modal card anim-in iw-modal" @click.stop>
      <div class="iw-head">
        <h3 class="modal-title" style="margin:0"
            x-text="(I18N.lang==='ru' ? 'Импорт: ' : 'Import: ') + tableLabel"></h3>
        <span class="flex1"></span>
        <button class="btn ghost-sm" @click="historyOpen=!historyOpen"
                x-text="I18N.lang==='ru' ? 'История' : 'History'"></button>
        <button class="icon-btn" @click="close()"
                x-html="icons.plus" style="transform:rotate(45deg)"></button>
      </div>

      <div class="alert error" x-show="error" x-transition.opacity
           x-text="error"></div>

      <!-- История -->
      <div class="iw-history" x-show="historyOpen">
        <div class="res-list">
          <template x-for="h in history" :key="h.id">
            <div class="res-item">
              <span class="badge b-blue" x-text="h.timestamp"></span>
              <span x-text="h.table_name"></span>
              <span class="muted" x-text="h.source_file"></span>
              <span class="flex1"></span>
              <span class="badge b-green" x-text="'+' + h.imported"></span>
              <span class="badge b-amber" x-text="'~' + h.updated"></span>
              <span class="badge b-red" x-text="'!' + h.errors"></span>
            </div>
          </template>
          <div class="muted fp-empty" x-show="!history.length">—</div>
        </div>
      </div>

      <!-- ШАГ 0: источник -->
      <div x-show="step === 0">
        <div class="iw-source">
          <label class="dz" style="flex:1">
            <div class="dz-empty">
              <span class="dz-ic" x-html="icons.upload"></span>
              <span class="dz-text"
                    x-text="I18N.lang==='ru' ? 'Файл .xlsx или .csv (до 10 МБ)' : '.xlsx or .csv file (up to 10 MB)'"></span>
              <input type="file" accept=".xlsx,.xlsm,.csv,.tsv,.txt"
                     class="dz-file" @change="pickFile($event)">
            </div>
          </label>
          <button class="btn" @click="pickClipboard()"
                  :disabled="busy"
                  x-html="icons.clipboard + (I18N.lang==='ru' ? 'Вставить из Excel (буфер)' : 'Paste from Excel')"></button>
          <button class="btn" @click="downloadTemplate()"
                  x-html="icons.download + (I18N.lang==='ru' ? 'Шаблон' : 'Template')"></button>
        </div>
        <!-- Листы -->
        <div class="chips" x-show="sheets.length > 1" style="margin-top:10px">
          <template x-for="s in [...sheets].sort()" :key="s">
            <button type="button" class="chip cmd"
                    :class="{on: sheet===s}" style="border-color:transparent"
                    @click="setSheet(s)" x-text="s"></button>
          </template>
        </div>
        <!-- Фото из ZIP -->
        <div class="card note" style="margin-top:14px">
          <b x-text="I18N.lang==='ru' ? 'Фото из ZIP-архива' : 'Photos from ZIP'"></b>
          <p style="margin:6px 0 10px" class="muted"
             x-text="I18N.lang==='ru' ? 'Имена файлов = значения колонки-ключа (например, ФИО). Сопоставление выполнится после выбора источника данных.' : 'File names = key column values (e.g. full name). Matching runs after a data source is loaded.'"></p>
          <label class="btn ghost-sm" style="cursor:pointer">
            <input type="file" accept=".zip" class="dz-file"
                   @change="pickPhotos($event)">
            <span x-html="icons.image + (I18N.lang==='ru' ? 'Загрузить ZIP с фото' : 'Upload photo ZIP')"></span>
          </label>
          <div class="res-list" x-show="photoResult" style="margin-top:10px">
            <template x-if="photoResult">
              <div class="res-item">
                <span class="badge b-green"
                      x-text="'✓ ' + photoResult.matched"></span>
                <span class="badge b-red"
                      x-text="'✗ ' + photoResult.unmatched_count"></span>
                <span class="muted"
                      x-text="(photoResult.unmatched || []).join(', ').slice(0, 120)"></span>
              </div>
            </template>
          </div>
        </div>
        <div class="spinner" x-show="busy" style="margin:14px auto"></div>
      </div>

      <!-- ШАГ 1: маппинг -->
      <div x-show="step === 1">
        <p class="muted" style="margin:4px 0 12px"
           x-text="I18N.lang==='ru'
             ? 'Сопоставьте колонки файла колонкам таблицы. Автоматически заполнено: '
               + mappedCount : 'Map file columns to table columns. Auto-mapped: '
               + mappedCount"></p>
        <div class="cm-list" style="max-height:260px">
          <template x-for="h in headers" :key="h">
            <div class="cm-row">
              <b style="flex:1" x-text="h"></b>
              <span style="color:var(--t-2)">→</span>
              <select class="field-input" style="flex:1.2"
                      x-model="mapping[h]">
                <option value="">— пропустить —</option>
                <template x-for="c in tableCols" :key="c.name">
                  <option :value="c.name" x-text="c.name"
                          :selected="mapping[h]===c.name"></option>
                </template>
              </select>
            </div>
          </template>
        </div>
        <!-- Объединение колонок -->
        <b class="sp-cap"
           x-text="I18N.lang==='ru' ? 'Объединение колонок' : 'Column merge'"></b>
        <template x-for="(m, i) in merges" :key="i">
          <div class="item-row" style="margin-bottom:6px">
            <select class="field-input" style="flex:1.4"
                    x-model="m.target">
              <option value="">—</option>
              <template x-for="c in tableCols" :key="'mt'+i+c.name">
                <option :value="c.name" x-text="c.name"></option>
              </template>
            </select>
            <span style="color:var(--t-2)">=</span>
            <input type="text" class="field-input" style="flex:2"
                   x-model="m.partsStr"
                   :placeholder="I18N.lang==='ru' ? 'Колонка 1, Колонка 2' : 'Col 1, Col 2'">
            <button class="icon-btn danger" @click="removeMerge(i)"
                    x-html="icons.trash"></button>
          </div>
        </template>
        <button class="linklike" @click="addMerge()"
                x-text="'+ ' + (I18N.lang==='ru'
                  ? 'объединить колонки' : 'merge columns')"></button>
        <!-- Режим и ключ -->
        <div class="form-grid" style="margin-top:14px">
          <label class="field"><span x-text="I18N.lang==='ru' ? 'Режим' : 'Mode'"></span>
            <select class="field-input" x-model="mode">
              <option value="upsert" x-text="I18N.lang==='ru' ? 'Обновлять существующие + добавлять' : 'Update existing + insert'"></option>
              <option value="insert" x-text="I18N.lang==='ru' ? 'Только добавлять' : 'Insert only'"></option>
            </select></label>
          <label class="field" x-show="mode==='upsert'">
            <span x-text="I18N.lang==='ru' ? 'Ключевая колонка (для поиска существующих)' : 'Key column (match existing)'"></span>
            <select class="field-input" x-model="keyField">
              <option value="">—</option>
              <template x-for="c in tableCols" :key="'kf'+c.name">
                <option :value="c.name" x-text="c.name"></option>
              </template>
            </select></label>
        </div>
        <!-- Схемы -->
        <div class="form-grid" style="align-items:end">
          <label class="field"><span x-text="I18N.lang==='ru' ? 'Сохранить схему как' : 'Save mapping as'"></span>
            <input type="text" class="field-input" id="iw-scheme-name" x-model="schemeName"></label>
          <button class="btn sm" @click="saveScheme()"
                  x-text="t('pr.save')"></button>
        </div>
        <div class="chips" x-show="schemes.length">
          <template x-for="(s, i) in schemes" :key="i">
            <span class="chip cmd" @click="applyScheme(s)"
                  x-text="s.name + ' ✕'"
                  @click.once="applyScheme(s)"></span>
          </template>
        </div>

        <div class="modal-foot">
          <button class="btn" @click="step=0"
                  x-text="I18N.lang==='ru' ? '← Источник' : '← Source'"></button>
          <button class="btn primary" @click="doAnalyze()" :disabled="busy"
                  x-text="I18N.lang==='ru' ? 'Анализ →' : 'Analyze →'"></button>
        </div>
      </div>

      <!-- ШАГ 2: анализ -->
      <div x-show="step === 2">
        <template x-if="analysis">
          <div>
            <div class="grid3" style="margin-bottom:14px">
              <div class="card stat"><div class="stat-num"
                   x-text="analysis.total"></div>
                <div class="stat-cap" x-text="I18N.lang==='ru' ? 'строк распознано' : 'rows parsed'"></div></div>
              <div class="card stat"><div class="stat-num" style="color:var(--ok)"
                   x-text="analysis.to_create"></div>
                <div class="stat-cap" x-text="I18N.lang==='ru' ? 'будет добавлено' : 'will be created'"></div></div>
              <div class="card stat"><div class="stat-num" style="color:var(--warn)"
                   x-text="analysis.to_update"></div>
                <div class="stat-cap" x-text="I18N.lang==='ru' ? 'будет обновлено' : 'will be updated'"></div></div>
            </div>
            <div class="alert error" x-show="analysis.errors.length">
              <b x-text="I18N.lang==='ru'
                 ? 'Ошибок: ' + analysis.error_count + ' (строки будут пропущены)'
                 : 'Errors: ' + analysis.error_count + ' (rows will be skipped)'"></b>
              <div class="pn-list" style="max-height:140px;margin-top:8px">
                <template x-for="(e, i) in analysis.errors" :key="i">
                  <div class="pn-item" style="padding:6px 10px"
                       x-text="e.error"></div>
                </template>
              </div>
            </div>
            <b class="sp-cap" x-text="I18N.lang==='ru' ? 'Пример первых записей' : 'Sample'"></b>
            <div class="pn-list">
              <template x-for="(r, i) in analysis.sample" :key="i">
                <div class="pn-item" style="font-size:12.5px"
                     x-text="JSON.stringify(r).slice(0, 200)"></div>
              </template>
            </div>
          </div>
        </template>
        <div class="modal-foot">
          <button class="btn" @click="step=1"
                  x-text="I18N.lang==='ru' ? '← Маппинг' : '← Mapping'"></button>
          <button class="btn primary" @click="doRun()" :disabled="busy"
                  x-text="I18N.lang==='ru' ? 'Импортировать!' : 'Import!'"></button>
        </div>
      </div>

      <!-- ШАГ 3: результат -->
      <div x-show="step === 3">
        <template x-if="runResult">
          <div>
            <div class="grid3" style="margin-bottom:14px">
              <div class="card stat"><div class="stat-num" style="color:var(--ok)"
                   x-text="runResult.created"></div>
                <div class="stat-cap" x-text="I18N.lang==='ru' ? 'добавлено' : 'created'"></div></div>
              <div class="card stat"><div class="stat-num" style="color:var(--warn)"
                   x-text="runResult.updated"></div>
                <div class="stat-cap" x-text="I18N.lang==='ru' ? 'обновлено' : 'updated'"></div></div>
              <div class="card stat"><div class="stat-num" style="color:var(--err)"
                   x-text="runResult.error_count"></div>
                <div class="stat-cap" x-text="I18N.lang==='ru' ? 'ошибок' : 'errors'"></div></div>
            </div>
            <div class="sp-actions">
              <button class="btn danger-sm" @click="undoLast()"
                      x-text="I18N.lang==='ru' ? 'Отменить импорт' : 'Undo import'"></button>
              <button class="btn ghost-sm" x-show="runResult.errors.length"
                      @click="downloadErrors()"
                      x-text="I18N.lang==='ru' ? 'Скачать ошибки (CSV)' : 'Download errors (CSV)'"></button>
            </div>
          </div>
        </template>
        <div class="modal-foot">
          <button class="btn primary" @click="close()"
                  x-text="I18N.lang==='ru' ? 'Готово' : 'Done'"></button>
        </div>
      </div>

      <div class="spinner" x-show="busy" style="margin:10px auto"></div>
    </div>
  </div>
</div>


<!-- ═══ ДИАЛОГ ЭКСПОРТА (Часть 10) ═══ -->
<div x-data="exportDialog()" x-cloak
     @suot-export.window="openD($event.detail.key)"
     @keydown.escape.window="open && (open=false)">
  <div class="overlay" x-show="open" style="display:none" x-show="open" x-transition.opacity x-cloak
       @click.self="open=false">
    <div class="modal card anim-in exp-modal" @click.stop>
      <h3 class="modal-title"
          x-text="(I18N.lang==='ru' ? 'Экспорт: ' : 'Export: ') + tableLabel"></h3>
      <div class="alert error" x-show="error" x-text="error"></div>

      <div class="form-grid">
        <label class="field"><span x-text="I18N.lang==='ru' ? 'Формат' : 'Format'"></span>
          <select class="field-input" x-model="format">
            <option value="xlsx">Excel (.xlsx)</option>
            <option value="csv">CSV (.csv)</option>
            <option value="json">JSON (.json)</option>
            <option value="docx" x-show="!isCustom">Word (.docx)</option>
          </select></label>
        <label class="field"><span x-text="I18N.lang==='ru' ? 'Диапазон' : 'Range'"></span>
          <select class="field-input" x-model="range">
            <option value="filtered" x-text="I18N.lang==='ru' ? 'Отфильтрованные (как на экране)' : 'Filtered (as on screen)'"></option>
            <option value="selected" x-text="I18N.lang==='ru' ? 'Только выбранные галочками' : 'Selected rows only'"></option>
            <option value="all" x-text="I18N.lang==='ru' ? 'Вся таблица' : 'Entire table'"></option>
          </select></label>
      </div>

      <b class="sp-cap" x-text="I18N.lang==='ru' ? 'Колонки (' + checkedCount + '/' + cols.length + ')' : 'Columns (' + checkedCount + '/' + cols.length + ')'"></b>
      <div class="exp-cols">
        <label class="exp-col">
          <input type="checkbox" class="cbx" :checked="checkedCount===cols.length"
                 @change="selectAllCols($event.target.checked)">
          <b x-text="I18N.lang==='ru' ? 'Все' : 'All'"></b>
        </label>
        <template x-for="c in cols" :key="c.name">
          <label class="exp-col">
            <input type="checkbox" class="cbx" x-model="c.checked">
            <span class="col-type-ic" x-html="icons[c.type==='Число' ? 'command' : c.type==='Дата' || c.type==='Годен до' ? 'calendar' : c.type==='Вычисляемая' ? 'layers' : 'fileText']"></span>
            <span x-text="c.name"></span>
          </label>
        </template>
      </div>

      <label class="remember-row" x-show="canPhotos">
        <input type="checkbox" class="cbx" x-model="withPhotos">
        <span x-text="I18N.lang==='ru' ? 'Миниатюры фото в ячейках' : 'Photo thumbnails in cells'"></span>
      </label>
      <label class="remember-row" x-show="canPhotos">
        <input type="checkbox" class="cbx" x-model="zipPhotos">
        <span x-text="I18N.lang==='ru' ? 'ZIP: xlsx + все фото отдельными файлами' : 'ZIP: xlsx + all photo files'"></span>
      </label>

      <div class="modal-foot">
        <button class="btn" @click="open=false" x-text="t('tbl.cancel')"></button>
        <button class="btn primary" @click="doExport()" :disabled="busy">
          <span class="spinner" x-show="busy"></span>
          <span x-show="!busy" x-html="icons.download + (I18N.lang==='ru' ? 'Экспортировать' : 'Export')"></span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ ПАКЕТНАЯ ПЕЧАТЬ (Часть 13) ═══ -->
<div x-data="batchPrint()" @suot-batch-print.window="openBatch($event)" x-cloak>
  <div class="overlay" x-show="open" style="display:none" x-show="open" x-transition.opacity x-cloak
       @click.self="open=false"
       @keydown.escape.window="open && (open=false)">
    <div class="modal card sm anim-in" @click.stop>
      <h3 class="modal-title"
          x-text="I18N.lang==='ru' ? 'Пакетная печать' : 'Batch print'"></h3>
      <p class="muted modal-note"
         x-text="I18N.lang==='ru' ? 'Записей выбрано: ' + selectedIds.length : 'Records: ' + selectedIds.length"></p>
      <div class="alert error" x-show="error" x-text="error"></div>
      <label class="field"><span x-text="I18N.lang==='ru' ? 'Водяной знак' : 'Watermark'"></span>
        <input type="text" class="field-input" x-model="watermark"
               :placeholder="I18N.lang==='ru' ? 'ЧЕРНОВИК (необязательно)' : 'DRAFT (optional)'"></label>
      <label class="remember-row">
        <input type="checkbox" class="cbx" x-model="merge">
        <span x-text="I18N.lang==='ru' ? 'Один общий PDF' : 'Single merged PDF'"></span>
      </label>
      <div class="modal-foot">
        <button class="btn" @click="open=false" x-text="t('tbl.cancel')"></button>
        <button class="btn primary" @click="doPrint()" :disabled="busy || !selectedIds.length">
          <span class="spinner" x-show="busy"></span>
          <span x-show="!busy" x-text="I18N.lang==='ru' ? 'Печать' : 'Print'"></span>
        </button>
      </div>
      <template x-if="result">
        <p class="muted" style="text-align:center"
           x-text="'✓ ' + result.count + (I18N.lang==='ru' ? ' документов' : ' documents')"></p>
      </template>
    </div>
  </div>
</div>

<!-- ═══ КОНСТРУКТОР ОТЧЁТОВ (Часть 14) ═══ -->
<div x-data="reportBuilder()" x-cloak
     @suot-reports.window="openR($event.detail.key)"
     @keydown.escape.window="open && (open=false)">
  <div class="overlay" x-show="open" style="display:none" x-show="open" x-transition.opacity x-cloak x-cloak
       @click.self="open=false">
    <div class="modal card anim-in rb-modal" @click.stop>
      <h3 class="modal-title"
          x-text="(I18N.lang==='ru' ? 'Отчёт: ' : 'Report: ') + tableLabel"></h3>
      <div class="alert error" x-show="error" x-text="error"></div>

      <div class="form-grid">
        <label class="field"><span x-text="I18N.lang==='ru' ? 'Поиск' : 'Search'"></span>
          <input type="text" class="field-input" x-model="q"></label>
        <label class="field"><span x-text="I18N.lang==='ru' ? 'Группировать по' : 'Group by'"></span>
          <select class="field-input" x-model="groupBy">
            <option value="">—</option>
            <template x-for="c in cols" :key="'gb'+c.name">
              <option :value="c.name" x-text="c.name"></option>
            </template>
          </select></label>
        <label class="field" x-show="groupBy"><span x-text="I18N.lang==='ru' ? 'Агрегат' : 'Aggregate'"></span>
          <select class="field-input" x-model="aggregate">
            <option value="count">Count</option><option value="sum">Sum</option>
            <option value="avg">Avg</option><option value="min">Min</option>
            <option value="max">Max</option>
          </select></label>
        <label class="field" x-show="groupBy && aggregate!=='count'">
          <span x-text="I18N.lang==='ru' ? 'Поле для агрегата' : 'Aggregate field'"></span>
          <select class="field-input" x-model="aggField">
            <option value="">—</option>
            <template x-for="c in cols.filter(c => c.type==='Число')" :key="'af'+c.name">
              <option :value="c.name" x-text="c.name"></option>
            </template>
          </select></label>
      </div>

      <b class="sp-cap" x-text="I18N.lang==='ru' ? 'Колонки' : 'Columns'"></b>
      <div class="exp-cols">
        <template x-for="c in cols" :key="c.name">
          <label class="exp-col">
            <input type="checkbox" class="cbx" :checked="selectedCols.has(c.name)"
                   @change="toggleCol(c.name)">
            <span x-text="c.name"></span>
          </label>
        </template>
      </div>

      <div class="modal-foot">
        <button class="btn ghost-sm" x-show="result" @click="exportCsv()"
                x-text="I18N.lang==='ru' ? 'Экспорт CSV' : 'Export CSV'"></button>
        <span class="flex1"></span>
        <button class="btn primary" @click="run()" :disabled="busy"
                x-text="I18N.lang==='ru' ? 'Выполнить' : 'Run'"></button>
      </div>

      <!-- Результат -->
      <template x-if="result">
        <div class="rb-result">
          <p class="muted" x-text="I18N.lang==='ru' ? 'Всего записей: ' + result.total : 'Total: ' + result.total"></p>
          <!-- Grouped -->
          <template x-if="result.mode==='grouped'">
            <table class="grid" style="font-size:13px">
              <thead><tr>
                <th x-text="I18N.lang==='ru' ? 'Группа' : 'Group'"></th>
                <th>Count</th>
                <th x-show="groupBy && aggregate!=='count'"
                    x-text="aggregate + '(' + (aggField || '') + ')'"></th>
              </tr></thead>
              <tbody>
                <template x-for="g in result.groups" :key="g.group">
                  <tr>
                    <td x-text="g.group"></td>
                    <td class="num" x-text="g.count"></td>
                    <td class="num" x-show="groupBy && aggregate!=='count'"
                        x-text="g.aggregate"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>
          <!-- Flat -->
          <template x-if="result.mode==='flat'">
            <table class="grid" style="font-size:12.5px">
              <thead><tr>
                <template x-for="c in result.columns" :key="c">
                  <th x-text="c"></th>
                </template>
              </tr></thead>
              <tbody>
                <template x-for="r in result.items.slice(0, 50)" :key="r.id">
                  <tr>
                    <template x-for="c in result.columns" :key="c">
                      <td x-text="r[c] || ''"></td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </template>
        </div>
      </template>

      <div class="modal-foot">
        <button class="btn" @click="open=false" x-text="t('tbl.cancel')"></button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ ЦЕНТР НАСТРОЕК (Часть 17) ═══ -->
<div x-data="settingsCenter()" x-cloak
     @suot-open-settings.window="openCenter()"
     @keydown.escape.window="open && (open=false)">
  <div class="sc-overlay" x-show="open" x-transition:enter="anim-in">
    <div class="sc-modal">
      <div class="sc-head">
        <b x-text="I18N.lang==='ru' ? 'Настройки' : 'Settings'"></b>
        <span class="flex1"></span>
        <button class="icon-btn" @click="exportSettings()" title="Экспорт настроек"
                x-html="icons.download"></button>
        <label class="icon-btn" title="Импорт настроек" style="cursor:pointer">
          <span x-html="icons.upload"></span>
          <input type="file" accept=".json,application/json"
                 @change="importSettings($event.target.files[0]); $event.target.value=''">
        </label>
        <button class="icon-btn" @click="resetConfirm=true" title="Сбросить всё"
                x-html="icons.undoIc"></button>
        <button class="icon-btn" @click="open=false"
                x-html="icons.plus" style="transform:rotate(45deg)"></button>
      </div>

      <!-- Подтверждение сброса -->
      <template x-if="resetConfirm">
        <div class="sc-body" style="background:var(--bg-2)">
          <p style="margin-bottom:12px"
             x-text="ru('Сбросить все настройки к стандартным?', 'Reset all settings to defaults?')"></p>
          <div style="display:flex;gap:8px">
            <button class="btn primary sm" @click="doReset()"
                    x-text="ru('Да, сбросить', 'Yes, reset')"></button>
            <button class="btn ghost-sm" @click="resetConfirm=false"
                    x-text="t('cancel')"></button>
          </div>
        </div>
      </template>

      <div class="sc-tabs" x-show="!resetConfirm">
        <button class="sc-tab" :class="{active: tab==='look'}" @click="tab='look'"
                x-text="ru('Внешний вид', 'Appearance')"></button>
        <button class="sc-tab" :class="{active: tab==='keys'}" @click="tab='keys'"
                x-text="ru('Горячие клавиши', 'Hotkeys')"></button>
        <button class="sc-tab" :class="{active: tab==='acct'}" @click="tab='acct'"
                x-text="ru('Аккаунт', 'Account')"></button>
        <button class="sc-tab" :class="{active: tab==='data'}" @click="tab='data'"
                x-text="ru('Данные', 'Data')"></button>
        <button class="sc-tab" :class="{active: tab==='plug'}" @click="tab='plug'"
                x-text="ru('Плагины', 'Plugins')"></button>
      </div>

      <!-- ВНЕШНИЙ ВИД -->
      <div class="sc-body" x-show="tab==='look' && !resetConfirm">
        <div class="sc-section-title" x-text="ru('Тема', 'Theme')"></div>
        <div class="theme-grid anim-stagger">
          <template x-for="th in themes" :key="th.id">
            <div class="theme-card" :class="{sel: draft.theme===th.id}"
                 @mouseenter="hoverTheme(th.id)" @mouseleave="leaveTheme()"
                 @click="pickTheme(th.id)">
              <div class="theme-sw" :style="'background:'+th.sw"></div>
              <span x-text="th.label"></span>
            </div>
          </template>
        </div>

        <div class="sc-section-title" x-text="ru('Акцентный цвет', 'Accent')"></div>
        <div class="accent-row">
          <input type="color" :value="draft.accent" @input="pickAccent($event)">
          <code x-text="draft.accent" style="font-size:12px;color:var(--t-1)"></code>
          <div class="acc-presets" style="margin-left:auto">
            <template x-for="p in window.Appearance.PRESETS" :key="p">
              <span class="acc-dot" :style="'background:'+p"
                    :class="{sel: draft.accent===p}"
                    @click="window.Appearance.save({accent:p}); draft.accent=p"
                    :title="p"></span>
            </template>
          </div>
        </div>

        <div class="sc-section-title" x-text="ru('Шрифт', 'Font')"></div>
        <div class="seg">
          <template x-for="f in fonts" :key="f.id">
            <button :class="{active: draft.font_family===f.id}"
                    @click="setFont(f.id)" x-text="f.label"></button>
          </template>
        </div>

        <div class="sc-section-title" x-text="ru('Масштаб', 'Scale')"></div>
        <div class="seg">
          <button :class="{active: draft.font_scale===0.9}" @click="setScale(0.9)">90%</button>
          <button :class="{active: draft.font_scale===1.0}" @click="setScale(1.0)">100%</button>
          <button :class="{active: draft.font_scale===1.1}" @click="setScale(1.1)">110%</button>
          <button :class="{active: draft.font_scale===1.25}" @click="setScale(1.25)">125%</button>
        </div>

        <div class="switch-row" style="margin-top:14px">
          <span x-text="ru('Акриловое стекло', 'Acrylic glass')"></span>
          <div class="seg">
            <button :class="{active: draft.glass}" @click="setGlass(true)"
                    x-text="ru('Вкл','On')"></button>
            <button :class="{active: !draft.glass}" @click="setGlass(false)"
                    x-text="ru('Выкл','Off')"></button>
          </div>
        </div>

        <div class="sc-section-title" x-text="ru('Плотность таблиц', 'Table density')"></div>
        <div class="seg">
          <button :class="{active: draft.density==='compact'}" @click="setDensity('compact')"
                  x-text="ru('Плотно','Compact')"></button>
          <button :class="{active: draft.density==='comfortable'}" @click="setDensity('comfortable')"
                  x-text="ru('Обычно','Normal')"></button>
          <button :class="{active: draft.density==='spacious'}" @click="setDensity('spacious')"
                  x-text="ru('Просторно','Spacious')"></button>
        </div>

        <div class="sc-section-title" x-text="ru('Скругления', 'Corner radius')"></div>
        <div class="seg">
          <button :class="{active: draft.radius==='sm'}" @click="setRadius('sm')"
                  x-text="ru('Малые','Small')"></button>
          <button :class="{active: draft.radius==='md'}" @click="setRadius('md')"
                  x-text="ru('Средние','Medium')"></button>
          <button :class="{active: draft.radius==='lg'}" @click="setRadius('lg')"
                  x-text="ru('Большие','Large')"></button>
        </div>

        <div class="sc-section-title" x-text="ru('Водяной знак по умолчанию', 'Default watermark')"></div>
        <div style="display:flex;gap:8px">
          <input type="text" class="field-input" style="flex:1"
                 :placeholder="ru('Напр.: ЧЕРНОВИК', 'e.g. DRAFT')"
                 x-model="draft.watermark">
          <button class="btn primary sm" @click="saveWatermark()" x-text="t('tbl.save')"></button>
        </div>

        <div class="sc-section-title" x-text="ru('Пользовательский CSS', 'Custom CSS')"></div>
        <textarea class="field-input" rows="5"
                  style="font-family:Consolas,monospace;font-size:12px"
                  :placeholder="ru('/* например: .tab-title { letter-spacing:.3px } */', '/* your styles */')"
                  x-model="draft.custom_css" spellcheck="false"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn primary sm" @click="saveCustomCss()"
                  x-text="t('tbl.save')"></button>
          <span class="muted" style="font-size:12px;align-self:center"
                x-text="ru('Применяется мгновенно, лимит 20 КБ','Applies live, 20 KB limit')"></span>
        </div>
      </div>

      <!-- АККАУНТ -->
      <div class="sc-body" x-show="tab==='acct' && !resetConfirm">
        <div class="sc-section-title" x-text="ru('Смена пароля','Change password')"></div>
        <label class="field"><span x-text="ru('Старый пароль','Old password')"></span>
          <input type="password" class="field-input" x-model="pwdForm.old"></label>
        <label class="field"><span x-text="ru('Новый пароль (мин. 6)','New password (min 6)')"></span>
          <input type="password" class="field-input" x-model="pwdForm.p1"></label>
        <label class="field"><span x-text="ru('Повторите новый','Repeat new')"></span>
          <input type="password" class="field-input" x-model="pwdForm.p2"></label>
        <button class="btn primary sm" @click="changePassword()"
                x-text="ru('Сменить пароль','Change password')"></button>
        <p class="muted" style="font-size:12px;margin-top:10px"
           x-text="ru('После смены пароля другие сессии продолжат работать до истечения.','Other sessions stay valid until expiry.')"></p>
      </div>

      <!-- ДАННЫЕ (Часть 19: бэкапы) -->

        <div class="switch-row">
          <span x-text="ru('При каждом запуске (раз в сутки)','On every launch (daily)')"></span>
          <div class="seg">
            <button :class="{active: settings.enabled}" @click="settings.enabled=true; saveSettings()"
                    x-text="ru('Вкл','On')"></button>
            <button :class="{active: !settings.enabled}" @click="settings.enabled=false; saveSettings()"
                    x-text="ru('Выкл','Off')"></button>
          </div>
          <label class="field" style="margin-left:10px">
            <span x-text="ru('Хранить','Keep')"></span>
            <input type="number" min="1" max="50" class="field-input"
                   style="width:70px" x-model.number="settings.keep"
                   @change="saveSettings()">
          </label>
        </div>

        <div style="display:flex;gap:8px;margin:12px 0">
          <button class="btn primary sm" @click="create()" :disabled="busy"
                  x-text="busy ? ru('Создаём…','Working…') : ru('Создать резервную копию','Create backup')"></button>
          <button class="btn sm" @click="openFolder()"
                  x-text="ru('Папка данных…','Data folder…')"></button>
          <span class="flex1"></span>
          <button class="icon-btn" @click="load()" title="Обновить список"
                  x-html="icons.refresh"></button>
        </div>

        <template x-for="b in items" :key="b.name">
          <div class="hk-row">
            <span class="jn-sev" :class="b.tag==='auto' ? 'info' : 'warn'"
                  x-text="b.tag==='auto' ? 'AUTO' : 'РУЧНОЙ'"></span>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px" x-text="b.name"></div>

            <button class="btn ghost-sm" @click="preview(b.name)"
                    x-text="ru('Состав','Contents')"></button>
            <button class="btn ghost-sm" @click="download(b.name)"
                    x-text="ru('Скачать','Download')"></button>
            <button class="btn ghost-sm" style="color:var(--err)"

                    x-text="ru('Восстановить','Restore')"></button>

            <p class="muted" style="font-size:12.5px;margin:4px 0 8px"
               x-text="ru('Создан','Created') + ': ' + statsFor.created_at + ' · v' + statsFor.app_version"></p>
            <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px">
              <span x-text="ru('Пользователей','Users') + ': ' + (statsFor.stats.users||0)"></span>
              <template x-for="(n, t) in statsFor.stats.tables" :key="t">
                <span class="muted" x-text="t + ': ' + n"></span>
              </template>
            </div>
          </div>
        </template>

        <!-- Подтверждение восстановления -->
        <template x-if="restoreConfirm">
          <div class="overlay" style="z-index:260">
            <div class="modal card sm anim-in" @click.stop>
              <h3 class="modal-title danger-t"
                  x-text="ru('Восстановить из копии?','Restore from backup?')"></h3>
              <p class="muted modal-note"
                 x-text="ru('Текущие данные будут заменены содержимым архива ' + restoreConfirm + '. Приложение перезапустится.', 'Current data will be replaced by archive contents. The app will reload.')"></p>
              <div class="modal-foot">
                <button class="btn" @click="restoreConfirm=null" x-text="t('tbl.cancel')"></button>
                <button class="btn primary" @click="doRestore()"
                        x-text="ru('Заменить данные','Replace data')"></button>
              </div>
            </div>
          </div>
        </template>
      </div>

      <!-- ПЛАГИНЫ -->
      <div class="sc-body" x-show="tab==='plug' && !resetConfirm"
           x-init="$watch('tab', v => v==='plug' && Alpine.store('plugins').load())">
        <template x-if="$store.plugins && $store.plugins.loaded">
          <div>
            <template x-for="pl in $store.plugins.list" :key="pl.id">
              <div class="hk-row">
                <div style="flex:1;min-width:200px">
                  <b style="font-size:13.5px" x-text="pl.name"></b>
                  <span class="ua-badge" x-show="!pl.enabled"
                        x-text="ru('выключен','off')"></span>
                  <div class="muted" style="font-size:12px;margin-top:2px"
                       x-text="pl.description"></div>
                  <div class="muted" style="font-size:11px"
                       x-text="'v' + pl.version + ' · ' + pl.author"></div>
                </div>
                <button class="btn ghost-sm" @click="$store.plugins.toggle(pl.id)"
                        x-text="pl.enabled ? ru('Выключить','Disable') : ru('Включить','Enable')"></button>
              </div>
            </template>
            <p class="muted" style="font-size:12px;margin-top:10px"
               x-text="ru('Плагины лежат в папке web/plugins как JSON-манифесты. Скопируйте template.json, чтобы создать свой.', 'Plugins live in web/plugins as JSON manifests. Copy template.json to create your own.')"></p>
          </div>
        </template>
      </div>

      <!-- ГОРЯЧИЕ КЛАВИШИ -->
      <div class="sc-body" x-show="tab==='keys' && !resetConfirm">
        <template x-for="(label, action) in hotkeys" :key="action">
          <div class="hk-row">
            <span class="hk-name" x-text="window.Hotkeys.LABELS[action] || action"></span>
            <button class="hk-combo" :class="{capturing: hkCapture===action}"
                    @click="startCapture(action)"
                    x-text="hkCapture===action ? ru('Нажмите клавиши…', 'Press keys…') : hotkeys[action]"></button>
            <button class="icon-btn" @click="clearHotkey(action)"
                    x-html="icons.undoIc" title="По умолчанию"></button>
          </div>
        </template>
        <p class="hk-conflict" x-show="hkConflict"
           x-text="ru('Занято действием:', 'Taken by:') + ' ' + hkConflict"></p>
        <p style="color:var(--t-2);font-size:12.5px;margin-top:12px"
           x-text="ru('Кликните по комбинации и нажмите новое сочетание. Esc — отмена.', 'Click a combo and press new keys. Esc cancels.')"></p>
      </div>
    </div>
  </div>
</div>

<!-- ═══ F1 ЦЕНТР ПОМОЩИ (Часть 18) ═══ -->
<div x-data="helpCenter()" x-cloak
     @suot-hotkey-help.window="openHelp()"
     @keydown.escape.window="open && (open=false)">
  <div class="sc-overlay" x-show="open" x-transition:enter="anim-in">
    <div class="sc-modal">
      <div class="sc-head">
        <b x-text="ru('Справка','Help')"></b>
        <span class="flex1"></span>
        <button class="icon-btn" @click="open=false"
                x-html="icons.plus" style="transform:rotate(45deg)"></button>
      </div>
      <div class="sc-tabs">
        <button class="sc-tab" :class="{active: tab==='quick'}"
                @click="tab='quick'" x-text="ru('Быстрый старт','Quick start')"></button>
        <button class="sc-tab" :class="{active: tab==='keys'}"
                @click="tab='keys'" x-text="ru('Горячие клавиши','Hotkeys')"></button>
        <button class="sc-tab" :class="{active: tab==='guide'}"
                @click="tab='guide'" x-text="ru('Руководство','Guide')"></button>
        <button class="sc-tab" :class="{active: tab==='about'}"
                @click="tab='about'" x-text="ru('О программе','About')"></button>
      </div>

      <!-- Быстрый старт -->
      <div class="sc-body hc-quick" x-show="tab==='quick'">
        <ol class="hc-steps">
          <li><b>Ctrl+K</b> — <span x-text="ru('палитра команд: поиск по таблицам и действиям','command palette: search tables & actions')"></span></li>
          <li><b>Ctrl+N</b> — <span x-text="ru('новая запись в открытой таблице','new record in active table')"></span></li>
          <li><b>Двойной клик</b> — <span x-text="ru('быстрое редактирование ячейки','quick cell edit')"></span></li>
          <li><b>F1</b> — <span x-text="ru('эта справка','this help')"></span></li>
        </ol>
        <p class="muted" x-text="ru('Совет: полный тур можно запустить кнопкой ниже.','Tip: replay the tour below.')"></p>
        <button class="btn primary sm" @click="open=false; $dispatch('suot-tour-start', {force: true})"
                x-text="ru('Запустить обзор интерфейса','Replay interface tour')"></button>
      </div>

      <!-- Хоткеи: живой чит-лист -->
      <div class="sc-body" x-show="tab==='keys'">
        <template x-for="row in hkRows" :key="row.action">
          <div class="hk-row hk-click" @click="runHotkey(row.action)">
            <span class="hk-name" x-text="row.label"></span>
            <span class="flex1 muted" style="font-size:12px"
                  x-text="ru('выполнить →','run →')"></span>
            <span class="hk-combo" style="cursor:pointer"
                  x-text="row.combo"></span>
          </div>
        </template>
        <p class="muted" style="font-size:12px;margin-top:10px"
           x-text="ru('Клик по строке выполняет действие.','Click a row to run the action.')"></p>
      </div>

      <!-- Руководство -->
      <div class="sc-body" x-show="tab==='guide'">
        <details class="hc-mod" open>
          <summary x-text="MODULES[0][1]"></summary>
          <p x-text="MODULES[0][2]"></p>
        </details>
        <template x-for="m in MODULES.slice(1)" :key="m[0]">
          <details class="hc-mod">
            <summary x-text="m[1]"></summary>
            <p x-text="m[2]"></p>
          </details>
        </template>
      </div>

      <!-- О программе -->
      <div class="sc-body" x-show="tab==='about'">
        <h3 style="margin:0 0 4px">СУОТ Enterprise Neo</h3>
        <p class="muted" style="margin-top:0"
           x-text="'Версия: ' + (version || '…')"></p>
        <template x-if="updateState">
          <div class="alert" :class="updateState.status!=='ok' ? 'error' : (updateState.up_to_date ? 'success':'warn')"
               x-show="true"
               x-text="updateState.status==='not_configured'
                 ? ru('Проверка не настроена — укажите URL манифеста.', 'Update check not configured.')
                 : updateState.status==='ok'
                   ? (updateState.up_to_date
                      ? ru('У вас последняя версия ' + updateState.current, 'Up to date ' + updateState.current)
                      : ru('Доступна версия ' + updateState.latest + '! ' + (updateState.download_url||''), 'New version ' + updateState.latest + '!'))
                 : ru('Манифест недоступен: ' + (updateState.error||''), 'Manifest unreachable')"></div>
        </template>
        <label class="field"><span
              x-text="ru('URL манифеста обновлений (админ)','Update manifest URL (admin)')"></span>
          <input type="text" class="field-input" x-model="updateUrl"
                 placeholder="https://example.com/suot/manifest.json"></label>
        <div style="display:flex;gap:8px">
          <button class="btn primary sm" @click="checkUpdate()" :disabled="checking"
                  x-text="checking ? ru('Проверяем…','Checking…') : ru('Проверить обновления','Check updates')"></button>
          <button class="btn ghost-sm" @click="saveUpdateUrl()"
                  x-text="t('tbl.save')"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══ ТУР НОВИЧКА (Часть 18) ═══ -->
<div x-data="onboardingTour()" x-cloak
     @suot-tour-start.window="start($event.detail ? !!$event.detail.force : false)"
     @keydown.escape.window="active && finish()"
     @resize.window="active && place()">
  <template x-if="active">
    <div class="tour-layer">
      <template x-if="rect">
        <div class="tour-hole" :style="'top:'+rect[0]+'px;left:'+rect[1]+'px;width:'+rect[2]+'px;height:'+rect[3]+'px'"></div>
      </template>
      <div class="tour-card card anim-in"
           :style="rect && rect[1] > window.innerWidth/2 ? 'right:'+(window.innerWidth - rect[1] + 16)+'px;top:'+Math.max(20,(rect[0]+ (rect[2]>200?40:0)))+'px' : ''">
        <div class="tour-dots">
          <template x-for="(s, i) in STEPS" :key="i">
            <span class="tour-dot" :class="{on: i===step}"></span>
          </template>
        </div>
        <h4 style="margin:6px 0 6px"
            x-text="STEPS[step].title"></h4>
        <p style="margin:0 0 12px;font-size:13.5px;line-height:1.5"
           x-text="STEPS[step].text"></p>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn ghost-sm" @click="finish()"
                  x-text="ru('Пропустить','Skip')"></button>
          <span class="flex1"></span>
          <button class="btn ghost-sm" x-show="step>0" @click="prev()"
                  x-text="ru('Назад','Back')"></button>
          <button class="btn primary sm" @click="next()"
                  x-text="step===STEPS.length-1 ? ru('Готово!','Done!') : ru('Далее','Next')"></button>
        </div>
      </div>
    </div>
  </template>
</div>

<!-- ═══ ПОЛЬЗОВАТЕЛИ — АДМИН (Часть 18) ═══ -->
<div x-data="usersAdmin()" x-cloak
     @suot-users-admin.window="$store.user && (Alpine.store('user').role||'').toLowerCase()==='administrator' && openPanel()"
     @keydown.escape.window="open && !confirmAction && (open=false)">
  <template x-if="open">
    <div class="sc-overlay">
      <div class="sc-modal" style="width:min(680px,94vw)">
        <div class="sc-head">
          <b x-text="ru('Пользователи','Users')"></b>
          <span class="flex1"></span>
          <button class="icon-btn" @click="open=false"
                  x-html="icons.plus" style="transform:rotate(45deg)"></button>
        </div>
        <div class="sc-body">
          <template x-for="u in users" :key="u.id">
            <div class="ua-row">
              <div class="ua-main">
                <b x-text="u.username"></b>
                <span class="ua-badge" :class="u.role==='Administrator' ? 'adm':''"
                      x-text="u.role==='Administrator' ? ru('Админ','Admin') : ru('Пользователь','User')"></span>
                <span class="ua-badge off" x-show="!u.active"
                      x-text="ru('заблокирован','blocked')"></span>
                <span class="muted" style="font-size:12px"
                      x-text="(u.full_name ? u.full_name + ' · ' : '') + ru(u.records + ' записей', u.records + ' records')"></span>
              </div>
              <div class="sp-actions">
                <button class="btn ghost-sm" :disabled="isSelf(u)"
                        @click="ask(u,'role')"
                        x-text="u.role==='Administrator' ? ru('Снять админа','Demote') : ru('Сделать админом','Promote')"></button>
                <button class="btn ghost-sm" :disabled="isSelf(u)"
                        @click="ask(u, u.active ? 'block' : 'unblock')"
                        x-text="u.active ? ru('Блокировать','Block') : ru('Разблокировать','Unblock')"></button>
                <button class="btn ghost-sm" @click="ask(u,'reset')"
                        x-text="ru('Сброс пароля','Reset password')"></button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </template>
  <template x-if="confirmAction">
    <div class="overlay" style="z-index:260">
      <div class="modal card sm anim-in" @click.stop>
        <h3 class="modal-title"
            x-text="confirmAction.kind==='reset'
              ? ru('Сбросить пароль «'+confirmAction.username+'»?', 'Reset password for «'+confirmAction.username+'»?')
              : confirmAction.kind==='block'
                ? ru('Заблокировать «'+confirmAction.username+'»?', 'Block «'+confirmAction.username+'»?')
                : confirmAction.kind==='unblock'
                  ? ru('Разблокировать «'+confirmAction.username+'»?', 'Unblock?')
                  : ru('Изменить роль «'+confirmAction.username+'»?', 'Change role?')"></h3>
        <div class="modal-foot">
          <button class="btn" @click="confirmAction=null" x-text="t('tbl.cancel')"></button>
          <button class="btn primary" @click="doConfirm()"
                  x-text="ru('Подтвердить','Confirm')"></button>
        </div>
      </div>
    </div>
  </template>
  <template x-if="newPwd">
    <div class="overlay" style="z-index:270">
      <div class="modal card sm anim-in" @click.stop>
        <h3 class="modal-title" x-text="ru('Новый пароль','New password')"></h3>
        <p class="muted modal-note"
           x-text="ru('Покажите его пользователю — больше он не будет отображаться.', 'Show it to the user — it will not be shown again.')"></p>
        <div class="ua-pwd"><code x-text="newPwd"></code></div>
        <div class="modal-foot">
          <button class="btn" @click="copyPwd()"
                  x-text="ru('Копировать','Copy')"></button>
          <button class="btn primary" @click="newPwd=null"
                  x-text="t('tbl.save')"></button>
        </div>
      </div>
    </div>
  </template>
</div>

<!-- Лайтбокс просмотра фото -->
<div x-data="{src:null}"
     @suot-lightbox.window="src=$event.detail.src"
     @keydown.escape.window="src=null" x-cloak>
  <div class="overlay lightbox" style="display:none" x-show="src" x-transition.opacity x-cloak
       @click="src=null">
    <div class="lightbox-inner" @click.stop>
      <img :src="src">
      <button class="icon-btn lb-close" @click="src=null"
              x-html="icons.plus" style="transform:rotate(45deg)"></button>
    </div>
  </div>
</div>

<!-- ═══ КОЛОКОЛЬЧИК НАПОМИНАНИЙ (Часть 15) ═══ -->
<div x-data="reminderBell()" x-init="init()" x-cloak>
  <button class="bell-btn" @click="toggle()"
          :title="I18N.lang==='ru' ? 'Напоминания' : 'Reminders'">
    <span x-html="icons.clock"></span>
    <span class="bell-badge" x-show="data.total > 0"
          x-text="data.total > 99 ? '99+' : data.total"></span>
  </button>
  <div class="overlay bell-overlay" x-show="open" x-transition.opacity
       @click.self="open=false"
       @keydown.escape.window="open && (open=false)">
    <div class="bell-panel card anim-in" @click.stop>
      <div class="pv-head">
        <b x-text="I18N.lang==='ru' ? 'Напоминания' : 'Reminders'"></b>
        <span class="badge b-red" x-show="data.overdue_count > 0"
              x-text="data.overdue_count"></span>
        <span class="badge b-amber" x-show="data.upcoming_count > 0"
              x-text="data.upcoming_count"></span>
        <span class="flex1"></span>
        <button class="btn ghost-sm" @click="openSettings()"
                x-text="I18N.lang==='ru' ? 'Настройки' : 'Settings'"></button>
      </div>

      <!-- Настройки lead days -->
      <div x-show="settingsOpen" class="bell-settings">
        <template x-for="(days, type) in settings" :key="type">
          <label class="field" style="display:flex;align-items:center;gap:8px">
            <span style="flex:1;font-size:13px" x-text="type"></span>
            <input type="number" class="field-input" style="width:70px"
                   x-model.number="settings[type]" min="0" max="365">
            <span class="muted" style="font-size:12px"
                  x-text="I18N.lang==='ru' ? 'дн.' : 'days'"></span>
          </label>
        </template>
        <button class="btn primary sm" @click="saveSettings()"
                x-text="I18N.lang==='ru' ? 'Сохранить' : 'Save'"></button>
      </div>

      <!-- Список -->
      <div class="bell-list" x-show="!settingsOpen">
        <template x-for="(item, i) in data.items" :key="i">
          <div class="bell-item" @click="openTable(item.table)">
            <span class="badge"
                  :class="item.status === 'overdue' ? 'b-red' : 'b-amber'"
                  x-text="item.status === 'overdue'
                    ? (I18N.lang==='ru' ? 'просрочено ' + item.days + ' дн.' : 'overdue ' + item.days + 'd')
                    : (I18N.lang==='ru' ? 'через ' + item.days + ' дн.' : 'in ' + item.days + 'd')"></span>
            <div class="bell-item-info">
              <span class="bell-item-lbl" x-text="item.label"></span>
              <span class="bell-item-title" x-text="item.title"></span>
            </div>
            <span class="muted bell-item-date" x-text="item.date"></span>
          </div>
        </template>
        <div class="muted fp-empty" x-show="!data.items.length"
             x-text="I18N.lang==='ru' ? 'Всё в порядке ✓' : 'All clear ✓'"></div>
      </div>
    </div>
  </div>
</div>

<!-- Тосты -->
<div class="toasts">
  <template x-for="tt in toasts" :key="tt.id">
    <div class="toast" :class="tt.type" x-text="tt.msg"
         x-transition:enter="anim-in"></div>
  </template>
</div>

<!-- ═══════════ КОМАНДНАЯ ПАЛИТРА Ctrl+K ═══════════ -->
<div x-data="cmdPalette()" x-cloak
     @suot-palette-open.window="show($event.detail ? $event.detail.q : '')">
  <div class="overlay palette-overlay" style="display:none" x-show="open" x-cloak x-transition.opacity
       @click.self="hide()"
       @keydown.escape.window="open && hide()"
       @keydown.arrow-down.prevent.window="open && move(1)"
       @keydown.arrow-up.prevent.window="open && move(-1)"
       @keydown.enter.window="open && runSelected()">
    <div class="palette card anim-in" @click.stop>
      <div class="palette-search">
        <span class="sb-icon" x-html="icons.command"></span>
        <input type="text" class="palette-input" x-model="query"
               :placeholder="t('pal.placeholder')"
               @input="idx=0; doSearch(query)">
      </div>
      <div class="palette-list">
        <template x-for="(it, i) in filtered" :key="it.id">
          <button class="palette-item" :class="{active: i===idx}"
                  @mouseenter="idx=i" @click="runSelected()">
            <span class="pi-icon" x-html="it.icon"></span>
            <span class="pi-label" x-text="it.label"></span>
            <span class="pi-group muted" x-text="it.group"></span>
          </button>
        </template>
        <div class="palette-empty muted" x-show="!filtered.length"
             x-text="t('pal.noResults')"></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
