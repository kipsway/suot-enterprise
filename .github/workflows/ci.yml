name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycodestyle pyflakes
          pip install -r requirements.txt
      - name: Lint
        run: |
          pyflakes --exclude=suot_platform.py .
          pycodestyle --max-line-length=100 --ignore=E402,W503,E501 .
      - name: Syntax check
        run: |
          python -m compileall -q -x 'suot_platform.py' .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xkb1 libxkbcommon-x11-0 libgl1-mesa-glx libegl1-mesa \
            xvfb
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt pytest-mock
      - name: Import check
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          modules = [
            'app_core.config', 'app_core.i18n', 'app_core.theme_engine',
            'app_core.utils', 'app_core.application',
            'services.database', 'services.security', 'services.session',
            'services.workerpool', 'services.telegram_bot',
            'services.rest_api', 'services.email_service',
            'modules.login', 'modules.dashboard', 'modules.employees',
            'modules.violations', 'modules.companies', 'modules.ledger',
            'modules.textbook', 'modules.statistics', 'modules.notes',
            'modules.reminders', 'modules.settings', 'modules.tools',
            'modules.data_dialogs', 'modules.print_engine',
            'modules.print_editor', 'modules.ai', 'modules.ai_insights',
            'modules.main_window',
          ]
          for m in modules:
            __import__(m)
            print(f'OK: {m}')
          print('All imports OK')
          "
      - name: Test with pytest
        run: xvfb-run python -m pytest tests/ -v --timeout=30 2>/dev/null || echo "No tests yet"
        continue-on-error: true
