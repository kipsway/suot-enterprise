name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: "Ruff (критичные правила: синтаксис, неопределённые имена, дубли)"
        run: |
          ruff check server services app_core scripts tests modules widgets --select E9,F63,F7,F82,F811 --output-format=concise
      - name: Syntax check
        run: |
          python -m compileall -q -x 'suot_platform.py' server services app_core scripts tests modules widgets

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Install system libraries (Qt/PDF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install Chromium (PDF-тесты через playwright)
        run: python -m playwright install chromium --with-deps
      - name: Run test suites
        run: python scripts/run_all_tests.py
